 return `<section class="business-profile-hero"><div class="business-monogram" aria-hidden="true">${esc(initials)}</div><div class="business-profile-intro"><p class="business-profile-eyebrow">${entries.length?entries.map(([id])=>esc(SERVICE_MODELS[id].label)).join(' · '):'Service provider'}</p><p class="business-coverage">Serving ${esc(area||'Service area not provided')}</p><span class="badge ${data.status==='approved'?'':'pending'}">${data.status==='approved'?'Active':data.status==='rejected'?'Paused':'Setup incomplete'}</span></div><div class="business-rating-summary">${rating.count?`<strong>${Number(rating.rating).toFixed(1)} <span aria-hidden="true">★</span></strong><span>${rating.count} ${rating.sample?'sample reviews':'booking review'+(rating.count===1?'':'s')}</span>`:'<strong class="business-new-label">New provider</strong><span>No booking reviews yet</span>'}</div></section>
 ${quote.length?`<section class="profile-price-highlight"><div><p>Your price for ${esc(SERVICE_MODELS[focus[0]].label.toLowerCase())}</p><strong>${serviceCurrency(quote.reduce((s,x)=>s+x[1],0))}</strong><span>${esc(state.move.from)} to ${esc(state.move.to)}</span></div><div class="profile-price-lines">${quote.map(([label,cost])=>`<span>${esc(label)}<b>${serviceCurrency(cost)}</b></span>`).join('')}</div></section>`:''}
 <div class="business-profile-layout"><section class="business-profile-section"><div class="profile-section-heading"><h3>Services and prices</h3>${entries.length?`<span>${entries.length} service${entries.length===1?'':'s'}</span>`:''}</div>${entries.length?entries.map(([id,c])=>{const m=SERVICE_MODELS[id];return `<article class="business-service-card" data-profile-service="${esc(id)}"><div class="business-service-heading"><span class="service-symbol" aria-hidden="true">${({movers:'↗',packers:'▣',unpackers:'▤',packing:'▣',internet:'⌁',cleaning:'✧',repairs:'⚒',storage:'▦',junk:'↺'})[id]||'✓'}</span><div><h4>${esc(m.label)}</h4><p>${esc(m.basis)}</p></div></div><p class="inclusions-label">Included</p><ul class="service-inclusion-chips">${c.includes.map(x=>`<li><span aria-hidden="true">✓</span>${esc(x)}</li>`).join('')}</ul><details class="service-price-table" ${id===selectedService?'open':''}><summary>View price tiers</summary><dl>${m.keys.map((k,i)=>`<div><dt>${esc(m.labels[i])}</dt><dd>${serviceCurrency(c.tiers[k])}</dd></div>`).join('')}${Object.entries(c.extras||{}).map(([k,v])=>`<div><dt>${esc({route:'Between-city transport',stairs:'Stairs per home',deep:'Deep-clean upgrade'}[k]||k)}</dt><dd>${serviceCurrency(v)}</dd></div>`).join('')}</dl></details>${id==='internet'?'<p class="hint">Setup assistance only. Subscriptions and utility bills are separate.</p>':id==='storage'?'<p class="hint">Price covers the first month. Renewals are arranged with the business.</p>':''}</article>`;}).join(''):'<div class="profile-empty"><span aria-hidden="true">▤</span><strong>Service details aren’t available yet</strong><p>Check the service information shown in your saved booking or comparison.</p></div>'}</section>
 <aside class="business-profile-section profile-availability"><h3>Availability</h3><p class="profile-small-label">Working days</p><div class="working-day-chips">${[[1,'Mon'],[2,'Tue'],[3,'Wed'],[4,'Thu'],[5,'Fri'],[6,'Sat'],[0,'Sun']].map(([n,label])=>`<span class="${days.includes(n)?'available':'unavailable'}" aria-label="${label}: ${days.includes(n)?'available':'not available'}">${label}</span>`).join('')}</div><p class="profile-small-label">Booking windows</p><div class="time-window-chips">${windows.length?windows.map(w=>`<span>${esc(WINDOWS[w]||w)}</span>`).join(''):'<span>Not configured</span>'}</div><p class="hint profile-availability-note">Check available dates and slots when reviewing your booking.</p><div class="profile-booking-assurance"><strong>Clear prices before you book</strong><p>Your chosen services and applicable extras appear in the booking total.</p></div></aside></div>
 <section class="business-profile-section profile-review-section"><div class="profile-section-heading"><h3>Reviews from completed bookings</h3>${data.reviews?.length?`<span>${data.reviews.length} review${data.reviews.length===1?'':'s'}</span>`:''}</div>${data.reviews?.length?reviewCards(data.reviews,data.can_moderate):'<div class="profile-empty review-empty"><span aria-hidden="true">☆</span><strong>No booking reviews yet</strong><p>Customers can share their experience after a service is completed.</p></div>'}${data.sample_reviews?.length?`<details class="profile-sample-reviews"><summary>Sample reviews (${data.sample_reviews.length})</summary><p class="hint">Illustrative feedback for this starter listing, separate from completed-booking reviews.</p>${reviewCards(data.sample_reviews,false,true)}</details>`:''}</section>
 <footer class="business-profile-footer"><p>Compare the details before choosing a provider.</p><button type="button" class="btn btn-line" data-profile-close>Back to comparison</button></footer>`;
}
showProviderDetails=async function(id,selectedService){const dialog=openProviderDialog('Provider details'),generation=requestGeneration;dialog.classList.add('provider-profile-dialog');const body=dialog.querySelector('.provider-dialog-body');try{const {data,error}=await sb.rpc('moveme_provider_details',{p_provider_id:id});if(error)throw error;if(!dialog.isConnected||generation!==requestGeneration)return;dialog.querySelector('#provider-dialog-title').textContent=data.name||'Provider details';body.removeAttribute('role');providerRatings[id]=data.summary;body.innerHTML=providerProfileContent(data,selectedService);body.querySelector('[data-profile-close]').onclick=()=>dialog.close();if(!state.signedIn){body.querySelector('.business-profile-footer p').textContent='Services, availability and feedback for this business.';body.querySelector('[data-profile-close]').textContent='Close profile';}body.querySelectorAll('[data-moderate-review]').forEach(button=>button.onclick=()=>showModeration(dialog,id,button.dataset.moderateReview,button.dataset.hidden==='true'));}catch(err){if(dialog.isConnected){body.innerHTML=`<div class="profile-empty"><strong>Couldn’t load this provider</strong><p>${esc(requestError(err))}</p><button class="btn btn-line" data-details-retry>Try again</button></div>`;body.querySelector('button').onclick=()=>{dialog.close();showProviderDetails(id,selectedService);};}}};

 const grid=document.createElement('div');grid.className='provider-workspace-grid';const content=document.createElement('div');content.className='provider-bookings-column';content.append(inbox);const sidebar=document.createElement('aside');sidebar.className='provider-business-sidebar';sidebar.setAttribute('aria-label','Business settings');const ids=Object.keys(p.services||{}),days=p.schedule?.days||[],windows=p.schedule?.windows||[];const rating=providerRatings[p.id];
 sidebar.innerHTML=`<section class="workspace-business-card"><div class="workspace-business-heading"><span class="workspace-avatar" aria-hidden="true">${esc(p.business.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase())}</span><div><h2>${esc(p.business)}</h2><span class="badge">Active</span></div></div><p class="hint">${esc(p.area==='All three cities'?'Dallas, Houston and Austin':p.area)}</p><button class="btn btn-line workspace-edit" data-provider-edit>Edit profile</button><div class="workspace-sidebar-section"><h3>Your services <span>${ids.length}</span></h3><div class="workspace-service-chips">${ids.map(id=>`<span>${esc(SERVICE_MODELS[id]?.label||id)}</span>`).join('')}</div><button class="clear" data-provider-edit>Edit services and prices</button></div><div class="workspace-sidebar-section"><h3>Availability</h3><p class="workspace-hours">${days.map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(', ')||'Not configured'}</p><p class="hint">${windows.map(w=>WINDOWS[w]).join(' / ')}</p><button class="clear" data-provider-edit>Edit availability</button></div><div class="workspace-sidebar-section"><h3>Customer feedback</h3><p class="provider-rating" data-provider-rating="${esc(p.id)}">${rating?esc(ratingText(rating)):'Loading rating…'}</p><button class="clear" data-view-provider="${esc(p.id)}">View feedback</button></div><button class="btn btn-line workspace-profile-preview" data-view-provider="${esc(p.id)}">View business profile</button></section>`;

adminApplicationDetails=function(r){const entries=Object.entries(r.services||{}).filter(([id,c])=>SERVICE_MODELS[id]&&c?.tiers),schedule=r.schedule||{},ready=providerSetupProgress(providerFromRow(r));return `<div class="admin-business-heading"><div><p class="admin-detail-eyebrow">Provider account</p><h2>${esc(r.business_name==='Business setup incomplete'?r.contact_name+' · business setup':r.business_name)}</h2><p class="hint">${esc(r.service_area||'Service area not configured')}</p></div><span class="badge ${r.status==='approved'?'':r.status==='rejected'?'danger-badge':'pending'}">${adminStatus(r.status)}</span></div><section class="admin-detail-section"><h3>Contact details</h3><dl class="admin-contact-grid">${[['Contact',r.contact_name],['Email',r.email],['Phone',r.phone||'Not added'],['Joined',r.created_at?new Date(r.created_at).toLocaleDateString():'Not available']].map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v||'Not added')}</dd></div>`).join('')}</dl></section><section class="admin-detail-section"><div class="admin-section-heading"><h3>Services and prices</h3><span>${entries.length} service${entries.length===1?'':'s'}</span></div>${entries.length?entries.map(([id,c])=>`<details class="admin-service-details"><summary>${esc(SERVICE_MODELS[id].label)}<span>${esc(SERVICE_MODELS[id].basis)}</span></summary><ul class="service-inclusion-chips">${c.includes.map(x=>`<li><span aria-hidden="true">✓</span>${esc(x)}</li>`).join('')}</ul><dl class="admin-price-table">${SERVICE_MODELS[id].keys.map((k,i)=>`<div><dt>${esc(SERVICE_MODELS[id].labels[i])}</dt><dd>${serviceCurrency(c.tiers[k])}</dd></div>`).join('')}${Object.entries(c.extras||{}).map(([k,v])=>`<div><dt>${esc({route:'Between-city transport',stairs:'Stairs per home',deep:'Deep clean'}[k]||k)}</dt><dd>${serviceCurrency(v)}</dd></div>`).join('')}</dl></details>`).join(''):'<p class="hint">The provider has not completed service setup.</p>'}</section><section class="admin-detail-section"><h3>Availability</h3><p class="admin-schedule-days">${(schedule.days||[]).map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(', ')||'Not configured'}</p><p class="hint">${(schedule.windows||[]).map(w=>WINDOWS[w]).join(' / ')||'No time slots added'}</p></section>${r.status==='pending'?`<section class="admin-detail-section"><h3>Setup progress</h3><div class="admin-setup-checks">${['Business and services','Prices and inclusions','Availability and contact'].map((label,i)=>`<span class="${ready[i]?'complete':''}">${ready[i]?'✓':'○'} ${label}</span>`).join('')}</div><p class="hint">Complete profiles activate automatically after email verification.</p></section>`:''}<div class="admin-detail-section"><div class="admin-section-heading"><h3>Customer feedback</h3><button class="btn btn-line btn-sm" data-view-provider="${esc(r.id)}">View customer feedback</button></div></div><details class="admin-listing-controls" ${r.status==='rejected'?'open':''}><summary>Listing controls</summary><p class="hint">${r.status==='approved'?'Pause new bookings while resolving a listing issue. Existing booking records stay saved.':r.status==='rejected'?'Restore this listing after the issue is resolved.':'This account will become visible after the provider finishes setup.'}</p>${r.rejection_reason?`<p class="admin-pause-note"><strong>Pause reason</strong><br>${esc(r.rejection_reason)}</p>`:''}${r.status==='approved'?'<div class="field"><label for="pause-reason">Reason for pausing</label><textarea id="pause-reason" maxlength="2000" placeholder="Explain the issue the provider needs to resolve."></textarea></div><button class="btn btn-line admin-pause-action" data-pause-provider>Pause listing</button>':r.status==='rejected'?'<button class="btn btn-line" data-resume-provider>Restore listing</button>':''}<p id="management-error" class="form-err" role="alert"></p>${r.reviewed_at?`<p class="hint">Last listing decision: ${esc(adminDate(r.reviewed_at))}</p>`:''}</details>`;};

let homeMediaRows=[],homeMediaOwner=null,homeMediaBusy=false;
const HOME_MEDIA_BUCKET='moveme-home-media';
function mediaQuery(){return sb.from('moveme_home_media');}
async function fetchHomeMedia(){if(!state.uid||!sb)return [];const owner=state.uid;const {data,error}=await mediaQuery().select('*').eq('customer_id',owner).eq('deleted',false).order('created_at');if(error)throw error;if(state.uid!==owner)return [];homeMediaRows=data||[];homeMediaOwner=owner;if(state.move)state.move.homeMedia=homeMediaRows.filter(m=>m.ready).map(m=>m.id);return homeMediaRows;}
function homeMediaMarkup(){return `<details class="form-details home-media-editor"><summary>Photos and video of your home <span class="hint">Optional</span></summary><p class="hint">Show rooms, large furniture, entrances or areas needing cleaning. Shared privately with your booked providers. Avoid people, valuables and personal documents.</p><button type="button" class="btn btn-line media-upload-label" data-media-pick>Add photos or video</button><input id="home-media-files" class="media-file-input" hidden aria-label="Home photos or video" type="file" multiple accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime"><p class="hint">Up to 6 photos (10 MB each) and 1 video (50 MB). Aim for a 30–60 second walkthrough. JPG, PNG, WebP, MP4, WebM or MOV; video playback depends on your browser.</p><p class="hint" id="home-media-status" role="status">Loading your media…</p><p class="form-err" id="home-media-error" role="alert"></p><div class="home-media-grid" id="home-media-grid"></div></details>`;}
async function mediaTile(m,editable=false){const {data,error}=await sb.storage.from(HOME_MEDIA_BUCKET).createSignedUrl(m.path,300);if(error)throw error;const url=esc(data.signedUrl);return `<article class="home-media-tile">${m.kind==='video'?`<video controls playsinline preload="metadata" src="${url}" aria-label="${esc(m.caption||'Home walkthrough')}"></video><a class="media-open-video" href="${url}" target="_blank" rel="noopener">Open video</a>`:`<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${esc(m.caption||'Home photo')}" loading="lazy"></a>`}${editable?`<label>Caption (optional)<input data-media-caption="${esc(m.id)}" maxlength="160" value="${esc(m.caption)}" placeholder="e.g. Living room, current home"></label><button type="button" class="clear media-remove" data-media-remove="${esc(m.id)}">Remove ${m.kind==='video'?'video':'photo'}</button>`:m.caption?`<p>${esc(m.caption)}</p>`:''}</article>`;}
async function paintHomeMedia(){const grid=document.getElementById('home-media-grid');if(!grid)return;const rows=homeMediaRows;const tiles=await Promise.all(rows.map(m=>m.ready?mediaTile(m,true):Promise.resolve(`<article class="home-media-tile"><p>Upload incomplete</p><p class="hint">Remove this item, then upload it again.</p><button type="button" class="clear media-remove" data-media-remove="${esc(m.id)}">Remove ${m.kind==='video'?'video':'photo'}</button></article>`)));if(!grid.isConnected)return;grid.innerHTML=tiles.join('');document.getElementById('home-media-status').textContent=rows.length?`${rows.filter(m=>m.kind==='photo').length}/6 photos · ${rows.filter(m=>m.kind==='video').length}/1 video`:'No media added. You can continue without uploading.';}
function mediaError(error){const el=document.getElementById('home-media-error');if(el)el.textContent=error.code||error.name==='StorageApiError'?'Uploads are unavailable right now. Try again later, or continue without media.':'Could not save your media. '+(error.message||'Check your connection and try again.');}
async function uploadHomeMedia(files){if(homeMediaBusy)return;homeMediaBusy=true;const owner=state.uid;const picker=document.getElementById('home-media-files');picker.disabled=true;const trigger=document.querySelector('[data-media-pick]');if(trigger)trigger.disabled=true;try{await fetchHomeMedia();for(const file of files){if(state.uid!==owner)throw Error('Please sign in again.');const photo=['image/jpeg','image/png','image/webp'].includes(file.type),video=['video/mp4','video/webm','video/quicktime'].includes(file.type);if(!photo&&!video)throw Error('Choose a JPG, PNG, WebP, MP4, WebM or MOV file.');const kind=photo?'photo':'video',limit=photo?10:50;if(!file.size||file.size>limit*1024*1024)throw Error(`${file.name} exceeds the ${limit} MB limit.`);if(homeMediaRows.filter(m=>m.kind===kind).length>=(photo?6:1))throw Error(photo?'You can add up to 6 photos.':'Remove your existing video before adding another.');const id=crypto.randomUUID(),ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov'}[file.type],path=owner+'/'+id+'.'+ext;document.getElementById('home-media-status').textContent='Uploading '+file.name+'…';const row={id,customer_id:owner,path,kind,mime_type:file.type,bytes:file.size};const insert=await mediaQuery().insert(row);if(insert.error)throw insert.error;try{const upload=await sb.storage.from(HOME_MEDIA_BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(upload.error)throw upload.error;const ready=await mediaQuery().update({ready:true}).eq('id',id);if(ready.error)throw ready.error;}catch(error){await mediaQuery().update({deleted:true}).eq('id',id);await sb.storage.from(HOME_MEDIA_BUCKET).remove([path]);throw error;}await fetchHomeMedia();await paintHomeMedia();}save();}catch(error){mediaError(error);}finally{homeMediaBusy=false;if(picker.isConnected){picker.disabled=false;picker.value='';if(trigger?.isConnected)trigger.disabled=false;}if(state.move)save();}}
const mediaSetupRender=renderSetup;
renderSetup=function(){mediaSetupRender();const form=document.getElementById('setup');form.querySelector('button[type=submit]').insertAdjacentHTML('beforebegin',homeMediaMarkup());form.addEventListener('submit',e=>{if(homeMediaBusy){e.preventDefault();e.stopImmediatePropagation();document.getElementById('home-media-error').textContent='Wait for the upload to finish before continuing.';}},true);fetchHomeMedia().then(paintHomeMedia).catch(error=>{const status=document.getElementById('home-media-status');if(status)status.textContent='You can continue without photos or video.';mediaError(error);});};

function financeBreakdown(row,provider=false){if(!financeTracked(row))return '<p class="hint">No payment record is available for this booking.</p>';const voided=row.payment_status==='released';return `<div class="finance-breakdown"><dl><div><dt>${voided?'Booked total':'Customer total'}</dt><dd>${serviceCurrency(Number(row.service_price))}</dd></div><div><dt>MoveMe fee · ${Number(row.commission_bps)/100}% <small>Included in the customer total</small></dt><dd>${serviceCurrency(Number(row.platform_fee))}</dd></div><div class="finance-net"><dt>${voided?'Quoted provider amount':provider?'Your amount':'Provider amount'}</dt><dd>${serviceCurrency(Number(row.provider_net))}</dd></div></dl><div class="finance-payment-status"><span>Payment</span><strong>${paymentLabel(row.payment_status)}</strong></div>${row.payment_status==='paid'&&row.payment_captured_at?`<p class="finance-payment-time">Paid ${esc(financeTime(row.payment_captured_at))}</p>`:row.payment_status==='authorized'&&row.payment_authorized_at?`<p class="finance-payment-time">Authorized ${esc(financeTime(row.payment_authorized_at))}</p>`:row.payment_status==='released'&&row.payment_released_at?`<p class="finance-payment-time">Released ${esc(financeTime(row.payment_released_at))}</p>`:''}${provider?`<p class="hint">${voided?'Your earnings: $0.00. No commission collected. The authorization was released.':row.payout_status==='on_hold'?'Payout on hold while the service issue is reviewed.':row.payment_status==='authorized'?'Earnings become eligible for payout when the job is completed.':row.payout_status==='paid'?'Your earnings were included in a paid payout.':`Payout scheduled ${row.payout_due_date?fmtDate(parseDate(row.payout_due_date)):'after completion'}.`}</p>`:`<p class="hint">${row.payment_status==='authorized'?'Amount charged: $0.00. Your booking total is authorized and charged after completion.':row.payment_status==='released'?'Amount charged: $0.00. Your authorization has been released. No provider earnings or commission collected.':'Amount charged: '+serviceCurrency(Number(row.service_price))+'.'} No additional MoveMe charge.</p>`}</div>`;}
function paintRateEarnings(){const form=document.getElementById('service-wizard');if(!form)return;form.querySelectorAll('[data-rate],[data-extra]').forEach(input=>{const parent=input.closest('label');if(!parent)return;let note=parent.querySelector('.rate-earnings-note');if(!note){note=document.createElement('small');note.className='rate-earnings-note';parent.append(note);}const amount=Number(input.value);if(!Number.isFinite(amount)||amount<0){note.textContent='Enter a valid customer price.';return;}const split=financialSplit(amount);note.innerHTML=`MoveMe ${serviceCurrency(split.fee)} <span>You receive <strong>${serviceCurrency(split.net)}</strong></span>`;});}
const financeProfileEdit=renderProviderProfileEdit;
renderProviderProfileEdit=function(...args){financeProfileEdit(...args);const step=document.querySelector('[data-wizard-step="1"]');if(step){step.querySelector('h2').insertAdjacentHTML('afterend','<div class="provider-fee-policy"><strong>Customer prices include MoveMe’s 10% fee</strong><p>You receive 90% of the booked total. No signup or subscription fee. Commission is collected only when a job is completed.</p><p class="hint">The final fee is calculated on the complete booking total, including applicable extras.</p></div>');const label=document.getElementById('rates-confirmed')?.parentElement;if(label)label.lastChild.textContent=' I confirm these customer prices, inclusions and the 10% MoveMe fee.';paintRateEarnings();const panels=document.getElementById('service-rate-panels');if(panels)new MutationObserver(paintRateEarnings).observe(panels,{childList:true});}};

async function checkBookingAuthorization(button){const owner=state.uid,generation=slotGeneration,error=document.getElementById('finance-readiness-error');if(!button?.isConnected||!error)return;button.dataset.financeReady='false';button.dataset.financeState='checking';error.textContent='Checking payment authorization…';error.setAttribute('role','status');try{if(!sb?.rpc)throw Error('Connection unavailable');const {data,error:failure}=await sb.rpc('moveme_finance_version');if(!button.isConnected||owner!==state.uid||generation!==slotGeneration)return;if(failure||data!==1)throw failure||Error('Payment authorization unavailable');button.dataset.financeReady='true';button.dataset.financeState='ready';error.textContent='';}catch(e){if(!button.isConnected||owner!==state.uid||generation!==slotGeneration)return;button.dataset.financeState='error';error.setAttribute('role','alert');error.innerHTML='Could not verify payment authorization. <button type="button" class="clear" data-retry-booking-authorization>Try again</button>';}}

renderReview=function(...args){financeReviewRender(...args);const button=document.getElementById('confirm');if(!button)return;const generation=slotGeneration,owner=state.uid;const selected=bookable().filter(t=>!state.bookings[t.id]&&state.picks[t.id]&&state.picks[t.id]!=='diy'&&t.providers.some(p=>p.id===state.picks[t.id]&&!p.archived));const totals=selected.map(t=>({name:t.providers.find(p=>p.id===state.picks[t.id]).name,...financialSplit(price(t,t.providers.find(p=>p.id===state.picks[t.id])))})),total=totals.reduce((s,x)=>s+Math.round(x.gross*100),0)/100;const summary=document.querySelector('.summary');summary.querySelector('.sumrow.total')?.insertAdjacentHTML('afterend',`<p class="customer-price-policy">No additional MoveMe charge. The provider’s 10% fee is included.</p><details class="finance-allocation"><summary>Where your payment goes</summary>${totals.map(x=>`<div><strong>${esc(x.name)}</strong><dl><div><dt>Customer total</dt><dd>${serviceCurrency(x.gross)}</dd></div><div><dt>MoveMe fee · 10%</dt><dd>${serviceCurrency(x.fee)}</dd></div><div><dt>Provider amount</dt><dd>${serviceCurrency(x.net)}</dd></div></dl></div>`).join('')}</details>`);const consent=summary.querySelector('.optin');if(consent)consent.lastChild.textContent=' I agree to authorize this total and share my contact details, home addresses and attached home media with the selected providers. Payment is charged after job completion.';button.textContent='Confirm and authorize '+serviceCurrency(total);button.dataset.financeReady='false';summary.insertAdjacentHTML('beforeend','<p class="form-err" id="finance-readiness-error" role="alert"></p>');checkBookingAuthorization(button);};

const financePreparationContent=jobPreparationContent;

renderProviderHome=function(...args){financeHomeRender(...args);const main=document.querySelector('.provider-workspace');if(!main){document.querySelector('main.provider-home>.wrap')?.insertAdjacentHTML('beforeend','<div class="provider-finance-access"><button type="button" class="btn btn-line btn-sm" data-provider-payouts>View earnings and payouts</button></div>');return;}const upcoming=providerRequestRows.filter(r=>r.status==='accepted'),tracked=upcoming.filter(financeTracked),untracked=upcoming.filter(r=>!financeTracked(r));const card=main.querySelector('.provider-workspace-stats>div:nth-child(2)');if(card&&providerRequestsLoaded){card.querySelector('span').textContent='Expected earnings';card.querySelector('strong').textContent=serviceCurrency(tracked.reduce((s,r)=>s+Number(r.provider_net),0));card.querySelector('small').innerHTML=`Customer totals ${serviceCurrency(tracked.reduce((s,r)=>s+Number(r.service_price),0))} · MoveMe fees ${serviceCurrency(tracked.reduce((s,r)=>s+Number(r.platform_fee),0))}${untracked.length?`<br>${untracked.length} booking${untracked.length===1?'':'s'} with untracked payments (${serviceCurrency(untracked.reduce((s,r)=>s+Number(r.service_price),0))})`:''}`;}const sidebar=main.querySelector('.workspace-business-card');sidebar?.insertAdjacentHTML('beforeend','<div class="workspace-sidebar-section"><h3>Earnings and payouts</h3><p class="hint">A clear record of customer totals, fees and your earnings.</p><button type="button" class="btn btn-line workspace-payouts" data-provider-payouts>View earnings and payouts</button></div>');};
function financialRequestLedger(rows){return rows.length?`<div class="finance-table-wrap" tabindex="0" role="region" aria-label="Financial records"><table class="finance-table"><thead><tr><th>Booking</th><th>Customer total</th><th>MoveMe fee</th><th>Your amount</th><th>Payment / payout</th></tr></thead><tbody>${rows.map(r=>`<tr><th scope="row">${esc(r.customer_name)}<small>${esc(r.service_type)} · ${fmtDate(parseDate(r.service_date))}</small><small>${requestCode(r)}</small></th><td>${serviceCurrency(Number(r.service_price))}</td><td>${financeTracked(r)?serviceCurrency(Number(r.platform_fee)):'—'}</td><td>${financeTracked(r)?serviceCurrency(Number(r.provider_net)):'—'}</td><td>${paymentLabel(r.payment_status)}<small>${payoutLabel(r.payout_status)}${r.payout_status==='pending'&&r.payout_due_date?' · '+fmtDate(parseDate(r.payout_due_date)):''}</small></td></tr>`).join('')}</tbody></table></div>`:'<div class="provider-empty"><b>No financial activity yet</b><p>Your bookings and earnings will appear here.</p></div>';}
function providerPayoutHistory(rows){return rows.length?`<div class="finance-table-wrap" tabindex="0" role="region" aria-label="Financial records"><table class="finance-table"><thead><tr><th>Payout</th><th>Customer totals</th><th>MoveMe fees</th><th>Paid to you</th></tr></thead><tbody>${rows.map(p=>`<tr><th scope="row">${esc(new Date(p.paid_at).toLocaleDateString('en-US',{timeZone:'America/Chicago',month:'short',day:'numeric',year:'numeric'}))}<small>Scheduled ${fmtDate(parseDate(p.scheduled_date))}</small><small>${p.booking_count} completed job${p.booking_count===1?'':'s'} · ${p.settlement_method==='automatic'?'Paid automatically':'Paid'}</small><small>${'PO-'+p.id.slice(0,8).toUpperCase()}</small></th><td>${serviceCurrency(Number(p.customer_total))}</td><td>${serviceCurrency(Number(p.platform_fee))}</td><td><strong>${serviceCurrency(Number(p.provider_amount))}</strong></td></tr>`).join('')}</tbody></table></div>`:'<p class="hint">No payouts yet. Completed jobs enter the next Friday payout.</p>';}
async function renderProviderPayouts(){const p=state.provider;if(!p){renderSignIn('provider');return;}document.getElementById('app').innerHTML=`${providerHeader()}<main class="page provider-payout-page"><div class="wrap"><div class="payout-page-heading"><div><p class="steps">Your business</p><h1>Earnings and payouts</h1><p class="intro">Customer totals, MoveMe fees and your earnings in one place.</p></div><button type="button" class="btn btn-line btn-sm" data-provider-home>Back to bookings</button></div><p class="payout-fee-policy">MoveMe’s fee is 10% of the booked customer total. No commission on cancelled jobs. Completed-job earnings enter the first Friday payout after completion.</p><div id="provider-finance-body" aria-live="polite"><p>Loading earnings…</p></div></div></main>`;try{const {data,error}=await sb.rpc('moveme_provider_finances');if(error)throw error;if(curScreen!=='providerpayouts'||state.provider?.id!==p.id)return;if(!data||data.provider_id!==p.id)throw Error('Could not load earnings.');const financialRows=new Map((data.requests||[]).map(r=>[r.id,r]));providerRequestRows=providerRequestRows.map(row=>{const fresh=financialRows.get(row.id);return fresh?{...row,...Object.fromEntries(['status','payment_status','payout_status','payout_id','payout_due_date','commission_bps','platform_fee','provider_net','finance_mode'].filter(k=>fresh[k]!==undefined).map(k=>[k,fresh[k]]))}:row;});document.getElementById('provider-finance-body').innerHTML=`${data.automatic_settlement_failed?'<p class="form-err" role="alert">The automatic payout check could not finish. Refresh earnings to try again.</p>':''}${(data.requests||[]).some(r=>r.payout_status==='on_hold')?`<p class="finance-hold-note">Earnings on hold: ${serviceCurrency((data.requests||[]).filter(r=>r.payout_status==='on_hold').reduce((n,r)=>n+Number(r.provider_net),0))}. Excluded from pending payouts while issues are reviewed.</p>`:''}<section class="payout-stats"><div><span>Expected earnings</span><strong>${serviceCurrency(Number(data.expected_net))}</strong><small>Customer totals ${serviceCurrency(Number(data.expected_customer_total))} · Fees ${serviceCurrency(Number(data.expected_fee))}<br>Jobs awaiting completion</small></div><div><span>Pending payout</span><strong>${serviceCurrency(Number(data.pending_net))}</strong><small>${data.next_payout_date?'Next payout: '+fmtDate(parseDate(data.next_payout_date)):'No completed-job earnings awaiting payout'}</small></div><div><span>Paid out</span><strong>${serviceCurrency(Number(data.paid_out))}</strong><small>Completed payout history</small></div></section><div class="payout-ledger-heading"><h2>Booking ledger</h2><button type="button" class="clear" data-provider-payouts>Refresh earnings</button></div>${data.untracked_count?`<p class="hint">${data.untracked_count} older booking${data.untracked_count===1?' has':'s have'} no payment record. They are excluded from earnings totals.</p>`:''}<p class="hint">Amounts show the saved booking breakdown. Released authorizations create no earnings or commission.</p>${financialRequestLedger(data.requests||[])}<section class="payout-history"><h2>Payout history</h2>${providerPayoutHistory(data.payouts||[])}</section>`;}catch(error){if(curScreen==='providerpayouts')document.getElementById('provider-finance-body').innerHTML='<p class="form-err" role="alert">Could not load earnings. Please try again.</p><button type="button" class="btn btn-line" data-provider-payouts>Try again</button>';}}

async function showAdminPayouts(){const dialog=openProviderDialog('Payout management'),body=dialog.querySelector('.provider-dialog-body');body.removeAttribute('role');body.innerHTML='<p role="status">Loading payouts…</p>';async function draw(){try{const {data,error}=await sb.rpc('moveme_admin_finances');if(error)throw error;if(!dialog.isConnected)return;if(!data||!Array.isArray(data.pending))throw Error('Could not load payouts.');body.innerHTML=`${data.automatic_settlement_failed?'<p class="form-err" role="alert">The automatic payout check could not finish. Review pending payouts and run a payout check.</p>':''}<section class="payout-stats admin-finance-stats"><div><span>Earned MoveMe fees</span><strong>${serviceCurrency(Number(data.earned_fees))}</strong></div><div><span>Pending provider payouts</span><strong>${serviceCurrency(Number(data.pending_payouts))}</strong></div><div><span>Paid to providers</span><strong>${serviceCurrency(Number(data.paid_out))}</strong></div></section><p class="hint">Due payouts are processed automatically. Only completed, paid bookings are eligible. Run a payout check if needed.</p><p><strong>Due now: ${serviceCurrency(Number(data.due_amount))}</strong></p><button class="btn btn-navy" type="button" data-process-payouts>Run payout check</button><div id="payout-process-confirm"></div><p class="form-err" id="payout-process-error" role="alert"></p><h3 class="admin-payout-heading">Pending bookings</h3>${data.pending.length?`<div class="admin-payout-rows">${data.pending.map(r=>`<div><strong>${esc(r.provider_name)}</strong><span>${esc(r.service_type)} · Due ${fmtDate(parseDate(r.due_date))}</span><small>Customer total ${serviceCurrency(Number(r.customer_total))} · Fee ${serviceCurrency(Number(r.fee))}</small><b>${serviceCurrency(Number(r.net))} to provider</b></div>`).join('')}</div>`:'<p class="hint">No payouts are pending.</p>'}<h3 class="admin-payout-heading">Payout history</h3>${data.payouts.length?data.payouts.map(p=>`<div class="admin-payout-history-row"><strong>${esc(p.provider_name)}</strong><span>${serviceCurrency(Number(p.provider_amount))} · ${p.settlement_method==='automatic'?'Paid automatically':'Paid'} ${esc(financeTime(p.paid_at))}</span><small>Customer totals ${serviceCurrency(Number(p.customer_total))} · MoveMe fees ${serviceCurrency(Number(p.platform_fee))} · ${'PO-'+p.id.slice(0,8).toUpperCase()}</small></div>`).join(''):'<p class="hint">No payouts have been processed.</p>'}`;body.querySelector('[data-process-payouts]').onclick=()=>{body.querySelector('#payout-process-confirm').innerHTML=`<div class="payout-confirmation"><p>Check and process due provider payouts? Current due amount: ${serviceCurrency(Number(data.due_amount))}.</p><button type="button" class="btn btn-line btn-sm" data-payout-cancel>Cancel</button><button type="button" class="btn btn-coral btn-sm" data-payout-confirm>Run check</button></div>`;body.querySelector('[data-payout-cancel]').onclick=()=>body.querySelector('#payout-process-confirm').replaceChildren();body.querySelector('[data-payout-confirm]').onclick=async()=>{const btn=body.querySelector('[data-payout-confirm]');btn.disabled=true;try{const result=await sb.rpc('moveme_process_due_payouts');if(result.error)throw result.error;await draw();toast(Number(result.data)+' payout'+(Number(result.data)===1?'':'s')+' processed.');}catch(error){body.querySelector('#payout-process-error').textContent='Could not process payouts. Refresh and try again.';btn.disabled=false;}};};}catch(error){if(dialog.isConnected)body.innerHTML='<p class="form-err" role="alert">Could not load payouts.</p><button class="btn btn-line" data-finance-retry>Try again</button>';body.querySelector('[data-finance-retry]')?.addEventListener('click',draw);}}await draw();}

function formattedAddressMarkup(move,side){

 const parts=full.split(',').map(x=>x.trim()).filter(Boolean);
 let street=parts[0]||full,locality=parts.slice(1).join(', ');
 if(a.line1&&full.toLowerCase().startsWith(a.line1.trim().toLowerCase())){street=a.line1.trim();locality=full.slice(street.length).replace(/^[,\s]+/,'');}
 // Keep manually entered text intact when it cannot be safely split.
 const unit=a.unit?`<span class="address-unit">Unit ${esc(a.unit)}</span>`:'';
 return `<span class="address-street">${esc(street)}</span>${locality||unit?`<span class="address-locality">${esc(locality)}${locality&&unit?' · ':''}${unit}</span>`:''}`;
}

function moveBudgetCategories(){
 const cents=value=>Number.isFinite(Number(value))?Math.max(0,Math.round(Number(value)*100)):0;
 let booked=0,selected=0,remaining=0;
 for(const task of allTasks()){
  if(!task.providers){remaining+=cents(task.fixed);continue;}
  const booking=state.bookings[task.id],status=bookingStatus(booking);
  if(booking&&['requested','accepted','completed'].includes(status)){booked+=cents(booking.price);continue;}
  if(!booking&&state.picks[task.id]==='diy')continue;
  const provider=!booking&&task.providers.find(p=>p.id===state.picks[task.id]&&!p.archived);
  if(provider){selected+=cents(price(task,provider));continue;}
  const options=task.providers.filter(p=>!p.archived).map(p=>price(task,p)).filter(x=>Number.isFinite(x)&&x>=0);
  if(options.length)remaining+=cents((Math.min(...options)+Math.max(...options))/2);
 }
 return {booked:booked/100,selected:selected/100,remaining:remaining/100,total:(booked+selected+remaining)/100};
}

async function paintReviewMediaPreviews(grid,ids,owner){

  const rows=(data||[]);if(!rows.length)return;const tiles=await Promise.all(rows.slice(0,4).map(async m=>{
   const label=m.caption||(m.kind==='video'?'Home walkthrough':'Home photo');
   if(m.kind==='video')return `<button type="button" class="review-media-thumb" data-show-home-media aria-label="Review ${esc(label)}"><span aria-hidden="true">▶ Video</span></button>`;
   try{const {data,error}=await sb.storage.from(HOME_MEDIA_BUCKET).createSignedUrl(m.path,300);if(error||!data?.signedUrl)throw Error();return `<button type="button" class="review-media-thumb" data-show-home-media aria-label="Review ${esc(label)}"><img src="${esc(data.signedUrl)}" alt="${esc(label)}"></button>`;}catch{return `<button type="button" class="review-media-thumb" data-show-home-media aria-label="Review ${esc(label)}"><span>Photo</span></button>`;}
  }));
  if(!grid.isConnected||state.uid!==owner)return;grid.innerHTML=tiles.join('')+(rows.length>4?`<button class="review-media-thumb" type="button" data-show-home-media aria-label="Review all ${rows.length} media items"><span>+${rows.length-4}</span></button>`:'');
 }catch{/* Keep the review action available when previews cannot load. */}
}

 else row.classList.add('addresses-only');

 const hero=document.querySelector('.conf-hero'),page=document.querySelector('main.page');if(!hero||!page)return;hero.classList.add('compact-confirmation-hero');page.classList.add('compact-confirmation-page');
 const refresh=page.querySelector('[data-refresh-requests]');if(refresh)refresh.textContent=customerRequestsLoading?'Checking status…':'Refresh status';const refreshHint=page.querySelector('.request-refresh .hint');if(refreshHint)refreshHint.textContent='Check for booking updates.';
 const ids=state.confIds?.length?state.confIds:Object.keys(state.bookings),tasks=ids.map(id=>TASKS.find(t=>t.id===id)).filter(t=>t&&state.bookings[t.id]);
 const confirmed=!!state.confIds?.length&&tasks.length>0&&tasks.every(t=>bookingStatus(state.bookings[t.id])==='accepted');
 hero.querySelector('h1').textContent=confirmed?(tasks.length===1?'Booking confirmed':'Bookings confirmed'):'Your bookings';

 hero.querySelector('p').textContent=confirmed?`${tasks.length} service${tasks.length===1?'':'s'} · ${serviceCurrency(cents/100)} booked total. Your dates, times and prices are saved.`:'View the latest status, schedule and payment details for your bookings.';
 page.querySelectorAll('.wrap>.conf-list>li').forEach((li,index)=>{const task=tasks[index];if(!task)return;const b=state.bookings[task.id],provider=task.providers?.find(p=>p.id===b.provider),actions=[...li.querySelectorAll('button,.booking-review-action')].filter(el=>!el.parentElement.closest('.booking-review-action'));

 actions.forEach(action=>li.firstElementChild.append(action));
 });
 page.querySelector('.confirmation-tasks')?.remove();page.querySelector('.request-status-note')?.remove();const next=document.createElement('p');next.className='confirmation-next';next.textContent='Track your services, manage bookings and finish your remaining tasks in your move plan.';const button=document.getElementById('toplan3');if(button){button.textContent='View my move plan';button.before(next);}

const SCREENS = {providerpayouts:renderProviderPayouts, adminhome:renderAdminHome, landing:renderLanding, signin:renderSignIn, provsignup:renderProviderSignup, provhome:renderProviderHome,
  provideredit:renderProviderProfileEdit, register:renderRegister, setup:renderSetup, review:renderReview, confirmation:renderConfirmation, plan:renderPlan, checkemail:renderCheckEmail, forgot:renderForgot};

// Screens that need someone signed in fall back to the home page after sign out.
function screenAllowed(name){
  if(name === "adminhome") return !!state.admin;
  if(name === "setup") return state.signedIn;
  if(name === "plan" || name === "review") return state.signedIn && !!state.move;
  if(name === "confirmation") return state.signedIn && Object.keys(state.bookings||{}).length > 0;
  if(name === "provhome" || name === "provideredit" || name === "providerpayouts") return !!state.provider;
  return true;
}
function addBackButton(){
  if(document.querySelector(".unified-header"))return;
  if(curScreen === "provideredit" && document.getElementById("service-wizard")) return;
  // Main destinations have their own navigation; forms use a named destination.
  let label, destination;
  if(curScreen === "provideredit") { label = "Back to provider home"; destination = "provhome"; }
  else if(curScreen === "setup" && !state.move) { label = "Edit account details"; destination = "register"; }
  else if(curScreen === "review") { label = "Back to my plan"; destination = "plan"; }
  else if((curScreen === "register" && !state.signedIn) || ["signin", "provsignup", "checkemail"].includes(curScreen)) { label = "Back to home"; destination = "landing"; }
  else if(curScreen === "forgot") { label = "Back to sign in"; destination = "signin"; }
  else return;
  const header = document.querySelector("#app .setup-top, #app .topbar .wrap");
  const mark = header && header.querySelector(".mark");
  if(!mark) return;
  const group = document.createElement("div");
  group.className = "nav-left";
  group.innerHTML = `<button type="button" class="back-btn" data-nav-destination="${destination}">${label}</button>`;
  mark.before(group);
  group.appendChild(mark);
}
document.addEventListener('click', e=>{const button=e.target.closest('[data-choose-task]');if(!button)return;const id=button.dataset.chooseTask;if(!id)return;state.open=id;renderPlan();const task=document.getElementById('t-'+id);if(task){task.scrollIntoView({behavior:'smooth',block:'center'});task.focus({preventScroll:true});}});
document.addEventListener("change", e=>{ if(e.target.matches('[data-show-password]')) document.querySelectorAll('#newpw input[autocomplete="new-password"]').forEach(input=>input.type=e.target.checked?'text':'password'); });
document.addEventListener("click", e=>{
  const button = e.target.closest("[data-nav-destination]");
  if(!button) return;
  const destination = button.dataset.navDestination;
  if(curScreen === "review") { syncDraft(); save(); }
  if(destination === "register") state.returnTo = null;
  const args = destination === "signin" ? (history.state?.args || []) : [];
  SCREENS[destination](...args);
  window.scrollTo(0,0);
});
window.addEventListener("popstate", e=>{
  const st = e.state;
  if(!st || !st.mm) return;                       // e.g. the landing page's "How it works" links
  if(st.screen === "landing" && curScreen === "landing") { navDepth = st.depth; return; }
  if(document.querySelector("[data-draft]") && typeof syncDraft === "function") syncDraft();
  const modal = document.getElementById("modal-root");
  if(modal && modal.innerHTML.trim() && typeof closeConfirm === "function") closeConfirm();
  navDepth = st.depth || 0;
  navPopping = true;
  try{
    if(screenAllowed(st.screen) && SCREENS[st.screen]) SCREENS[st.screen](...(st.args||[]));
    else renderLanding();
  } finally { navPopping = false; }
  window.scrollTo(0,0);
});

renderLanding();
if(sb){
  let handledRecovery = false;
  sb.auth.onAuthStateChange(evt=>{
    if(evt === "PASSWORD_RECOVERY" && !handledRecovery){ handledRecovery = true; setTimeout(()=>{ renderNewPassword(); window.scrollTo(0,0); }, 0); }
  });
  (async ()=>{
    try{
      const {data} = await sb.auth.getSession();
      const session = data && data.session;
      if(!session) return;
      if(OPENED_FROM_RESET){ if(!handledRecovery){ handledRecovery = true; renderNewPassword(); } return; }
      if(handledRecovery) return;
      await loadAccount(session.user.id);
      if(curScreen === "landing") renderLanding();   // buttons now say "Open my plan" or "My dashboard"
    }catch(e){}
  })();
}

<style id="install-app-style">
.install-app{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;max-width:520px;margin:0 auto;display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:14px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);font-family:var(--sans);font-size:15px;line-height:1.4}

</style>
<script id="install-app">
/* Installable app: offline-friendly shell plus a one-time "add to home screen" hint on the public landing page. */
(function(){
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const iosSafari = ios && /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios|gsa/i.test(navigator.userAgent);
  let deferred = null, dismissed = false;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; paint(); });
  window.addEventListener('appinstalled', () => { dismissed = true; document.querySelector('.install-app')?.remove(); });
  const share = '<svg class="install-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 12v8h14v-8"/></svg>';
  function paint(){
    const old = document.querySelector('.install-app');
    const onLanding = !!document.querySelector('.lp-nav');
    if(standalone || dismissed || !onLanding || (!deferred && !iosSafari)){ old?.remove(); return; }
    if(old) return;
    const box = document.createElement('aside');
    box.className = 'install-app'; box.setAttribute('aria-label', 'Install the Move Me app');
    box.innerHTML = '<img src="apple-touch-icon.png" alt=""><div><strong>Get the Move Me app</strong>' +
      (deferred ? '<p>Install it on your phone for one-tap access to your move plan.</p><div class="install-actions"><button type="button" class="install-go">Install app</button><button type="button" class="install-close">Not now</button></div>'
                : '<p>Tap ' + share + ' <strong>Share</strong>, then <strong>Add to Home Screen</strong>.</p><div class="install-actions"><button type="button" class="install-close">Got it</button></div>') + '</div>';
    box.querySelector('.install-close').onclick = () => { dismissed = true; box.remove(); };
    const go = box.querySelector('.install-go');
    if(go) go.onclick = async () => { const p = deferred; deferred = null; box.remove(); try{ await p.prompt(); }catch(e){} };
    document.body.append(box);
  }
  new MutationObserver(paint).observe(document.getElementById('app') || document.body, {childList: true});
  paint();
})();
</script>
