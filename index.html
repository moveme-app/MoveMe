<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Move Me: your move plan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#174E4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Move Me">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#F5F5F8; --card:#FFFFFF; --ink:#24262E; --muted:#6B6E7B; --line:#D9DAE6;
  --navy:#1E2761; --navy-deep:#161C4D; --on-navy:#FFFFFF; --on-navy-muted:#C5C9EC;
  --coral:#F96167; --coral-text:#B8363D; --tint:#D9DCF5; --good:#2F7D5B; --sun:#F9E795;
  --serif:"Source Serif 4", Cambria, Georgia, "Times New Roman", serif;
  --sans:Carlito, Calibri, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121633; --surface:#1A1F45; --card:#1D2350; --ink:#ECEDF5; --muted:#A6A9C2; --line:#2F3668;
    --navy:#161C4D; --navy-deep:#0F1438; --on-navy-muted:#AEB3DE; --coral-text:#FF8A8F; --tint:#2B3275; --good:#6FD0A5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121633; --surface:#1A1F45; --card:#1D2350; --ink:#ECEDF5; --muted:#A6A9C2; --line:#2F3668;
  --navy:#161C4D; --navy-deep:#0F1438; --on-navy-muted:#AEB3DE; --coral-text:#FF8A8F; --tint:#2B3275; --good:#6FD0A5;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 20px}

.mark{background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:20px;color:var(--on-navy)}
.mark i{width:28px;height:28px;border-radius:50%;background:var(--coral);display:grid;place-items:center}
.mark i::after{content:"";width:14px;height:14px;border-radius:50%;border:3px solid var(--navy-deep);box-shadow:inset 0 0 0 3px var(--coral),inset 0 0 0 7px var(--navy-deep)}

/* Setup screen */
.setup{background:var(--navy);color:var(--on-navy);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.setup-top{padding:24px 0}
.setup-main{flex:1;display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;padding-bottom:56px}
.setup h1{font-size:clamp(34px,5vw,54px);max-width:14ch;letter-spacing:-.01em}
.setup .lede{color:var(--on-navy-muted);font-size:19px;max-width:40ch;margin:18px 0 28px}
.promise{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.promise li{display:flex;gap:12px;align-items:baseline;color:var(--on-navy)}
.promise li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--coral);transform:translateY(-2px)}
.form-card{background:var(--card);color:var(--ink);border-radius:16px;padding:28px;box-shadow:0 24px 60px rgba(6,10,40,.35)}
.form-card h2{font-size:24px;margin-bottom:4px}
.form-card .hint{color:var(--muted);margin:0 0 20px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.field input,.field select{height:46px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--surface);width:100%}
.field input:focus,.field select:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px var(--tint)}
.field .err{color:var(--coral-text);font-size:14px;min-height:0}
.field.bad input,.field.bad select{border-color:var(--coral-text)}
.fit-row{display:flex;flex-wrap:wrap;gap:0 10px;align-items:flex-start}
.fit-row .field{flex:0 0 auto}
.fit-row .field input,.fit-row .field select{width:auto;padding:0 10px}
.field.fit input{width:auto;align-self:flex-start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:8px;border:0;cursor:pointer;font-weight:700}
.btn-coral{background:var(--coral);color:var(--navy-deep);width:100%;font-size:18px}
.btn-coral:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;color:var(--on-navy);border:1px solid rgba(255,255,255,.35);height:40px;padding:0 16px}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
.top-actions{display:flex;align-items:center;gap:10px}
.hello{color:var(--on-navy-muted);margin-right:4px}
.optin{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--muted);margin:2px 0 18px;cursor:pointer}
.optin input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--navy);flex:none}
.steps{color:var(--on-navy-muted);font-size:15px;margin:0 0 14px}
.fineprint{font-size:13px;color:var(--muted);margin:14px 0 0;text-align:center}

/* Plan screen */
.topbar{background:var(--navy);color:var(--on-navy)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:16px;padding-bottom:16px}
.hero{background:var(--navy);color:var(--on-navy);padding:8px 0 40px}
.route{font-family:var(--serif);font-size:clamp(28px,4.4vw,44px);font-weight:700;display:flex;flex-wrap:wrap;align-items:baseline;gap:.35em}
.route .to{color:var(--coral)}
.route .arrow{color:var(--on-navy-muted);font-weight:600}
.route-meta{color:var(--on-navy-muted);margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 2fr 1fr;gap:16px;margin-top:28px}
.stat{background:var(--navy-deep);border-radius:12px;padding:18px 20px}
.stat .k{font-size:14px;color:var(--on-navy-muted)}
.stat .v{font-family:var(--serif);font-size:34px;font-weight:700;line-height:1.1;margin-top:4px}
.stat .v small{font-family:var(--sans);font-size:15px;font-weight:400;color:var(--on-navy-muted)}
.meter{height:14px;border-radius:7px;background:rgba(255,255,255,.12);margin-top:12px;overflow:hidden;display:flex}
.meter .spent{background:var(--coral);height:100%;transition:width .4s ease}
.meter .proj{height:100%;background:repeating-linear-gradient(135deg,rgba(var(--accent-rgb),.55) 0 4px,rgba(var(--accent-rgb),.2) 4px 8px);transition:width .4s ease}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--on-navy-muted);margin-top:10px}
.legend b{color:var(--on-navy);font-weight:700}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.over{color:var(--sun);font-weight:700}

.plan{padding:36px 0 64px}
.plan-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.plan-head h2{font-size:28px}
.plan-head p{margin:0;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.task{display:grid;grid-template-columns:96px 28px 1fr;gap:0 14px;position:relative}
.task::before{content:"";position:absolute;left:calc(96px + 14px + 13px);top:0;bottom:0;width:2px;background:var(--line)}
.task:first-child::before{top:26px}
.task:last-child::before{bottom:calc(100% - 26px)}
.when{text-align:right;padding-top:14px}
.when .d{font-family:var(--serif);font-weight:700;font-size:18px}
.when .r{font-size:13px;color:var(--muted)}
.when .r.late{color:var(--coral-text);font-weight:700}
.dot{position:relative;z-index:1;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--muted);margin:19px auto 0}
.task.next .dot{border-color:var(--coral);background:var(--coral);box-shadow:0 0 0 5px color-mix(in srgb,var(--coral) 25%,transparent)}
.task.done .dot{border-color:var(--good);background:var(--good)}
.task.moveday .dot{width:22px;height:22px;margin-top:16px;border-color:var(--navy);background:var(--navy)}
:root[data-theme="dark"] .task.moveday .dot{border-color:var(--coral)}
.body{padding:8px 0 18px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.task.moveday .card{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.task.moveday .card .sub,.task.moveday .est .lbl{color:var(--on-navy-muted)}
.row{display:flex;align-items:flex-start;gap:14px;padding:14px 16px}
.check{flex:none;appearance:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;margin:2px 0 0;cursor:pointer;display:grid;place-items:center;background:var(--card)}
.check:checked{background:var(--good);border-color:var(--good)}
.check:checked::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task.moveday .check{background:transparent;border-color:var(--on-navy-muted)}
.main{flex:1;min-width:0}
.title{font-weight:700;font-size:18px;line-height:1.3}
.task.done .title{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.sub{color:var(--muted);font-size:15px;margin-top:2px}
.sub .chosen{color:var(--ink);font-weight:700}
.est{flex:none;text-align:right;font-size:15px}
.est .amt{font-weight:700;font-size:18px}
.est .lbl{color:var(--muted);font-size:13px}
.toggle{background:none;border:0;padding:0;margin-top:8px;color:var(--navy);font-weight:700;cursor:pointer;font-size:15px;text-decoration:underline;text-underline-offset:3px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toggle{color:var(--coral)}}
:root[data-theme="dark"] .toggle{color:var(--coral)}
.main-text{cursor:default}
.main-text[role="button"]{cursor:pointer;border-radius:8px;margin:-4px -6px;padding:4px 6px}
.main-text[role="button"]:hover{background:var(--surface)}
.main-text[role="button"]:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.tag{display:inline-block;background:var(--line);color:var(--muted);font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;vertical-align:1px}
.swap-hint{margin:2px 6px 8px;color:var(--muted);font-size:13px}
.swap-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:4px 6px 2px}
.swap-row .btn{width:auto;padding:0 16px;height:40px}
.shortlist .hint{margin:2px 6px 6px;color:var(--muted);font-size:13px}
.shortlist{border-top:1px solid var(--line);background:var(--surface);padding:6px 10px 10px}
.shortlist fieldset{border:0;margin:0;padding:0}
.shortlist legend{font-size:13px;color:var(--muted);padding:8px 6px 6px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;cursor:pointer;border:2px solid transparent}
.opt:hover{background:var(--card)}
.opt input{margin:4px 0 0;accent-color:var(--navy);width:18px;height:18px;flex:none}
.opt.sel{background:var(--card);border-color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.sel{border-color:var(--coral)}}
:root[data-theme="dark"] .opt.sel{border-color:var(--coral)}
.opt .n{font-weight:700}
.opt .desc{font-size:14px;color:var(--muted)}
.opt .meta{font-size:13px;color:var(--muted);margin-top:2px}
.opt .price{margin-left:auto;font-weight:700;font-size:17px;white-space:nowrap}
.clear{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:6px;text-decoration:underline}
.badge{display:inline-block;background:var(--good);color:#fff;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.badge.pending{background:var(--sun);color:var(--navy-deep)}
.conf-list .code small.confirmed{color:var(--good)}
#modal-root:empty{display:none}
.confirm-backdrop{position:fixed;inset:0;background:rgba(15,20,56,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999}
.confirm-box{background:var(--card);color:var(--ink);border-radius:14px;max-width:420px;width:100%;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.confirm-box h2{font-family:var(--serif);font-size:20px;margin:0 0 10px}
.confirm-box p{margin:0;color:var(--muted);line-height:1.5}
.confirm-actions{display:flex;gap:10px;margin-top:20px}
.confirm-actions .btn{flex:1;width:auto}
.btn-line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--coral-text);color:#fff}
.addtask{margin-top:22px;padding:16px 18px;border:1px dashed var(--line);border-radius:12px}
.addtask h3{font-size:18px;margin:0 0 4px;font-family:var(--serif)}
.addtask .hint{margin:0 0 10px;color:var(--muted);font-size:14px}
.addrow{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}
.addrow input{height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--card);color:var(--ink);min-width:0;font-family:var(--sans);font-size:15px}
.addtask .err{display:block;color:var(--coral-text);font-size:14px;margin-top:6px}
@media (max-width:560px){.addrow{grid-template-columns:1fr 1fr}.addrow input:first-child{grid-column:1/-1}}


.next-card{margin:28px 0 32px;background:var(--navy);color:var(--on-navy);border-radius:16px;padding:26px 28px;display:grid;grid-template-columns:1fr auto;gap:18px 28px;align-items:center}
.next-card h2{font-size:26px}
.next-card p{margin:6px 0 0;color:var(--on-navy-muted);max-width:60ch}
.next-card .btn-coral{width:auto;padding:0 26px}
.next-card .btn-coral[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.next-card .links{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:15px}
.next-card .links button{background:none;border:0;padding:0;color:var(--on-navy);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.page{padding:36px 0 64px}
.page h1{font-size:clamp(30px,4vw,40px)}
.page .intro{color:var(--muted);margin:8px 0 26px;max-width:62ch}
.back{background:none;border:0;padding:0;margin-bottom:18px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:15px}
.layout{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
.bk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.bk-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:12px}
.bk-head .t{font-size:14px;color:var(--muted)}
.bk-head .n{font-weight:700;font-size:19px}
.bk-head .price{font-weight:700;font-size:19px;white-space:nowrap}
.bk .grid2 .field{margin-bottom:10px}
.bk textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);resize:vertical}
.bk textarea:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px var(--tint)}
.later{background:var(--surface);border-radius:12px;padding:16px 20px;color:var(--muted);font-size:15px}
.later b{color:var(--ink)}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--surface);border-radius:14px;padding:22px}
.summary h2{font-size:22px;margin-bottom:12px}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px}
.sumrow.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-weight:700;font-size:18px}
.contact{font-size:15px;margin:16px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.contact .k{color:var(--muted);font-size:13px}
.summary .optin{margin:14px 0}
.summary .btn-coral{font-size:17px}
.form-err{color:var(--coral-text);font-size:14px;margin:0 0 10px}
.conf-hero{background:var(--navy);color:var(--on-navy);padding:40px 0 44px}
.conf-hero h1{font-size:clamp(32px,5vw,48px)}
.conf-hero p{color:var(--on-navy-muted);margin:10px 0 0;max-width:60ch}
.conf-list{list-style:none;margin:0 0 30px;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.conf-list li{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:16px 20px;border-top:1px solid var(--line);background:var(--card)}
.conf-list li:first-child{border-top:0}
.conf-list .n{font-weight:700;font-size:18px}
.conf-list .m{color:var(--muted);font-size:15px}
.conf-list .code{font-weight:700;text-align:right}
.conf-list .code small{display:block;font-weight:400;color:var(--coral-text);font-size:13px}
.steps-list{margin:0 0 30px;padding-left:22px;max-width:64ch}
.steps-list li{margin-bottom:10px;padding-left:4px}
.steps-list b{display:block}
.steps-list span{color:var(--muted);font-size:15px}
.todo{margin:6px 0 30px}
.todo-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:760px}
.todo-list li{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-top:1px solid var(--line);background:var(--card)}
.todo-list li:first-child{border-top:0}
.todo-main{display:flex;flex-direction:column;cursor:pointer}
.todo-main .n{font-weight:700}
.todo-main .m{color:var(--muted);font-size:14px}
.todo-main .late{color:var(--coral-text);font-weight:700}
.bk-actions{display:flex;flex-wrap:wrap;gap:4px 18px}
.toggle.danger{color:var(--coral-text)!important}
.page h2.sec{font-size:24px;margin:0 0 14px}
.btn-navy{background:var(--navy);color:var(--on-navy)}
:root[data-theme="dark"] .btn-navy{background:var(--coral);color:var(--navy-deep)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-navy{background:var(--coral);color:var(--navy-deep)}}
@media (max-width: 820px){
  .layout{grid-template-columns:1fr}
  .summary{position:static}
  .next-card{grid-template-columns:1fr}
  .next-card .btn-coral{width:100%}
}
/* Landing */
.lp-nav{background:var(--navy);color:var(--on-navy)}
.lp-nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:18px;padding-bottom:18px}
.lp-nav .links{display:flex;align-items:center;gap:22px}
.lp-nav a{color:var(--on-navy-muted);text-decoration:none;font-size:16px}
.lp-nav a:hover{color:var(--on-navy)}
.lp-hero{background:var(--navy);color:var(--on-navy);padding:40px 0 88px;position:relative;overflow:hidden}
.lp-hero::after{content:"";position:absolute;right:-180px;top:-160px;width:520px;height:520px;border-radius:50%;background:var(--navy-deep);z-index:0}
.lp-hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
.lp-hero h1{font-size:clamp(40px,6vw,68px);letter-spacing:-.015em;max-width:11ch}
.lp-hero h1 em{font-style:normal;color:var(--coral)}
.lp-hero .lede{font-size:20px;color:var(--on-navy-muted);max-width:42ch;margin:20px 0 30px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.cta-row .btn-coral{width:auto;padding:0 28px;height:54px}
.cta-row .ghost-link{color:var(--on-navy);font-weight:700;text-decoration:underline;text-underline-offset:4px;background:none;border:0;cursor:pointer;padding:0}
.cta-note{font-size:14px;color:var(--on-navy-muted);margin-top:14px}
.preview{background:var(--card);color:var(--ink);border-radius:16px;padding:22px;box-shadow:0 30px 70px rgba(6,10,40,.45);transform:rotate(1.2deg)}
.preview .k{font-size:13px;color:var(--coral-text);font-weight:700}
.preview .rt{font-family:var(--serif);font-weight:700;font-size:20px;margin:2px 0 2px}
.preview .mt{font-size:14px;color:var(--muted)}
.hero-photo{margin:0;border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(6,10,40,.45);border:6px solid var(--card);aspect-ratio:4 / 3;background:var(--surface)}
.hero-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:55% 50%}
.pv-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.pv-row:first-of-type{margin-top:12px}
.ic{flex:none;width:38px;height:38px;border-radius:50%;background:var(--coral);display:grid;place-items:center}
.ic img{width:20px;height:20px;display:block}
.ic.lg{width:56px;height:56px}.ic.lg img{width:28px;height:28px}
.pv-row .n{font-weight:700}
.pv-row .d{font-size:14px;color:var(--muted)}
.pv-row .c{margin-left:auto;font-weight:700}
.pv-bar{margin-top:14px;height:10px;border-radius:5px;background:var(--surface);overflow:hidden}
.pv-bar span{display:block;height:100%;width:53%;background:var(--coral)}
.pv-foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.lp-sec{padding:84px 0}
.lp-sec.alt{background:var(--surface)}
.lp-sec h2{font-size:clamp(30px,4vw,42px);max-width:22ch}
.lp-sec .sec-lede{color:var(--muted);font-size:19px;max-width:60ch;margin:14px 0 0}
.kicker{font-size:15px;font-weight:700;color:var(--coral-text);margin:0 0 10px}
.problem{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start;margin-top:40px}
.problem-points p{margin:0 0 18px;font-size:18px;padding-left:18px;border-left:3px solid var(--coral)}
.juggle{background:var(--navy);color:var(--on-navy);border-radius:16px;padding:26px}
.juggle h3{font-family:var(--sans);font-size:15px;color:var(--on-navy-muted);font-weight:700;margin-bottom:18px}
.juggle ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:22px 12px}
.juggle li{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:700}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:40px;counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px}
.step .num{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--muted);margin:16px 0 4px}
.step h3{font-size:22px;margin-bottom:8px}
.step p{margin:0;color:var(--muted)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:40px}
.col{border-radius:16px;padding:26px 28px}
.col.old{background:var(--card);border:1px solid var(--line)}
.col.new{background:var(--navy);color:var(--on-navy)}
.col h3{font-family:var(--sans);font-size:16px;font-weight:700;margin-bottom:14px}
.col.old h3{color:var(--muted)}
.col.new h3{color:var(--coral)}
.col ul{list-style:none;margin:0;padding:0}
.col li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:17px}
.col.new li{border-top-color:rgba(255,255,255,.14)}
.col li:first-child{border-top:0}
.col .x{color:var(--muted);font-weight:700;flex:none;width:18px}
.col .y{color:var(--coral);font-weight:700;flex:none;width:18px}
.col.old li span:last-child{color:var(--muted)}
.values{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:40px}
.value{display:flex;gap:18px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.value h3{font-size:21px;margin-bottom:6px}
.value p{margin:0;color:var(--muted)}
.forwho{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;margin-top:0}
.forwho h2{font-size:clamp(26px,3.4vw,34px);max-width:none}
.forwho p{margin:10px 0 0;color:var(--muted);font-size:18px;max-width:62ch}
.lp-final{background:var(--navy);color:var(--on-navy);padding:84px 0;text-align:center}
.lp-final h2{font-size:clamp(32px,5vw,50px);max-width:18ch;margin:0 auto}
.lp-final p{color:var(--on-navy-muted);font-size:19px;margin:16px auto 30px;max-width:48ch}
.lp-final .cta-row{justify-content:center}
.lp-foot{background:var(--navy-deep);color:var(--on-navy-muted);font-size:14px;padding:22px 0}
.lp-foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px}
@media (max-width: 900px){
  .lp-hero .wrap,.problem,.compare,.values{grid-template-columns:1fr}
  .lp-hero .wrap{gap:40px}
  .preview{transform:none}
  .steps3{grid-template-columns:1fr}
  .lp-nav .links a{display:none}
}
@media (max-width: 560px){
  .lp-sec{padding:60px 0}
  .juggle ul{grid-template-columns:repeat(2,1fr)}
  .forwho{grid-template-columns:1fr;padding:24px}
  .cta-row .btn-coral{width:100%}
  .lp-hero{padding-bottom:64px}
}

.btn-nav-cta{background:var(--coral);color:var(--navy-deep);height:40px;padding:0 16px}
.btn-nav-cta:hover{filter:brightness(1.05)}
.lp-nav .links .btn{height:40px;padding:0 14px;font-size:15px}
.foot-link{background:none;border:0;padding:0;color:var(--on-navy);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.opt.diy{border-top:1px dashed var(--line);border-radius:0 0 10px 10px;margin-top:4px}
.opt.diy.sel{border:2px solid var(--navy);border-radius:10px}
.prov-status{background:var(--surface);border-radius:12px;padding:16px 20px;margin-bottom:30px;max-width:760px}
.prov-dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin:0 0 32px;max-width:760px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.prov-dl div{padding:14px 18px;border-top:1px solid var(--line)}
.prov-dl div:nth-child(-n+2){border-top:0}
.prov-dl dt{font-size:13px;color:var(--muted)}
.prov-dl dd{margin:2px 0 0;font-weight:700}
.top-actions{flex-wrap:wrap;justify-content:flex-end}
@media (max-width: 700px){
  .lp-nav .wrap{flex-wrap:wrap}
  .lp-nav .links{width:100%;gap:8px}
  .lp-nav .links .btn{flex:1;padding:0 8px}
  .lp-nav .links .btn-nav-cta{display:none}
  .prov-dl{grid-template-columns:1fr}
  .prov-dl div:nth-child(2){border-top:1px solid var(--line)}
}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.field-note{font-size:13px;color:var(--muted)}
.field input[readonly]{opacity:.75;cursor:not-allowed}
.btn[disabled]{opacity:.6;cursor:progress}
.danger-badge{background:var(--coral-text);color:#fff}
.nav-left{display:flex;align-items:center;gap:14px;min-width:0}
.back-btn{display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 12px 0 8px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--on-navy);font-weight:700;font-size:15px;cursor:pointer}
.back-btn:hover{background:rgba(255,255,255,.08)}
.setup-top{display:flex;align-items:center}
.mark{white-space:nowrap}
@media (max-width: 560px){
  .topbar .wrap{flex-wrap:wrap;row-gap:12px}
  .topbar .nav-left{width:100%}
  .topbar .top-actions{width:100%;justify-content:stretch;flex-wrap:nowrap;gap:8px}
  .topbar .top-actions .btn{flex:1;padding:0 6px;height:38px;font-size:15px}
}
.si-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 14px}
.si-row .optin{margin:0}
.si-row .clear{padding:0}
.sample-note{color:var(--muted);font-size:15px;margin:-6px 0 14px;max-width:62ch}
.count-pill{display:inline-block;vertical-align:4px;margin-left:8px;background:var(--coral);color:var(--navy-deep);font-family:var(--sans);font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px}
.req-list{list-style:none;margin:0 0 32px;padding:0;max-width:760px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.req{display:flex;gap:16px 20px;align-items:center;justify-content:space-between;padding:16px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.req:first-child{border-top:0}
.req.declined .req-main{opacity:.55}
.req-main{flex:1 1 320px;min-width:0}
.req-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.req .n{font-weight:700;font-size:17px}
.req-price{font-weight:700;white-space:nowrap}
.req .m{color:var(--muted);font-size:14px;margin-top:2px}
.req-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.req-actions .m{margin:0}
.btn-sm{height:38px;padding:0 16px;font-size:15px;width:auto}
.badge.decl{background:var(--line);color:var(--muted)}
.todo-req{align-items:center}
.todo-badge{flex:none;margin:0}
.opt > span:not(.price){line-height:1.35;min-width:0}
.opt .meta{display:inline-block;margin-top:3px}
@media (max-width: 560px){
  .shortlist .opt{flex-wrap:wrap;column-gap:10px}
  .shortlist .opt > span:not(.price){flex:1 1 0}
  .shortlist .opt .price{flex-basis:100%;margin:6px 0 0 28px;font-size:16px}
}
.trust{display:flex;flex-direction:column;gap:2px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.trust span{padding-left:18px;position:relative}
.trust span::before{content:"";position:absolute;left:2px;top:5px;width:9px;height:5px;border:solid var(--good);border-width:0 0 2px 2px;transform:rotate(-45deg)}
.req-empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px 20px;color:var(--muted);max-width:760px;margin:0 0 32px}
.vetted-badge{display:inline-block;background:var(--good);color:#fff;font-size:13px;font-weight:700;border-radius:4px;padding:2px 8px;margin-right:10px;vertical-align:1px}
.foot{color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:18px;margin-top:8px}
.foot button{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:inherit}

@media (max-width: 820px){
  .setup-main{grid-template-columns:1fr;gap:32px;padding-top:8px}
  .stats{grid-template-columns:1fr 1fr}
  .stats .budget{grid-column:1 / -1;order:-1}
}
@media (max-width: 560px){
  .grid2{grid-template-columns:1fr}
  .grid2.stay2{grid-template-columns:auto 1fr;gap:10px}
  .grid2.stay2 .field.fit input{padding:0 10px}
  .hello{display:none}
  .btn-ghost{padding:0 12px}
  .task{grid-template-columns:64px 20px 1fr;gap:0 8px}
  .task::before{left:calc(64px + 8px + 9px)}
  .when .d{font-size:16px}
  .row{flex-wrap:wrap;padding:12px}
  .est{width:100%;text-align:left;padding-left:38px}
  .form-card{padding:22px}
  .shortlist{padding:4px 4px 8px}
  .opt{padding:10px 8px;gap:10px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<script>
const ACCESS = {ground:["Ground floor, no stairs",1],elevator:["Elevator",1.05],stairs:["Stairs",1.12]};
const SIZES = {studio:["Studio",0.6],"1br":["1 bedroom",0.8],"2br":["2 bedrooms",1],"3br":["3 bedrooms",1.35],"4br":["4+ bedrooms",1.7]};

// scale: which factors affect price. offset: days relative to move date (negative = before).
const TASKS = [
  {id:"notice", title:"Give notice to your landlord", offset:-60, note:"Check your lease for the notice period and move-out rules.", fixed:0},
  {id:"movers", title:"Book movers", offset:-42, service:{day:0, win:"morning", label:"Move date"}, scale:["size","access"], providers:[
    {id:"northstar", name:"Northstar Movers", desc:"Full service: they pack, load, drive and unload.", rating:"4.8", count:"312 moves", base:2400},
    {id:"cratehop", name:"CrateHop Containers", desc:"A portable container you load; they drive it.", rating:"4.6", count:"540 moves", base:1500},
    {id:"loadright", name:"LoadRight Crew + Truck", desc:"Two-person loading crew plus a rental truck you drive.", rating:"4.5", count:"198 moves", base:950}]},
  {id:"packing", title:"Order packing supplies", offset:-28, service:{day:-21, win:"any", label:"Delivery date"}, scale:["size"], providers:[
    {id:"boxbundle", name:"BoxBundle Kit", desc:"Boxes, tape and wrap delivered in two days.", rating:"4.7", count:"1,020 orders", base:110},
    {id:"greencrate", name:"GreenCrate Rentals", desc:"Reusable plastic crates, dropped off and picked up.", rating:"4.8", count:"410 rentals", base:160},
    {id:"wrapt", name:"Wrapt Packing Service", desc:"A crew packs your home the day before the move.", rating:"4.9", count:"126 jobs", base:520}]},
  {id:"internet", title:"Set up internet at your new home", offset:-21, service:{day:1, win:"afternoon", label:"Install date"}, providers:[
    {id:"beam", name:"Beam Fiber", desc:"Fiber, professional install. First month plus install fee.", rating:"4.6", count:"880 installs", base:115},
    {id:"citynet", name:"CityNet Cable", desc:"Cable internet, self-install kit shipped to you.", rating:"4.3", count:"1,340 installs", base:65},
    {id:"wave", name:"MetroWave 5G Home", desc:"Plug-in 5G router, no install appointment.", rating:"4.4", count:"620 setups", base:55}]},
  {id:"utilities", title:"Transfer electricity and gas", offset:-14, note:"Schedule shutoff for the day after you leave and start service the day before you arrive.", fixed:0},
  {id:"mail", title:"Forward your mail", offset:-14, note:"File a change of address online; there is a small identity check fee.", fixed:1},
  {id:"cleaning", title:"Book move-out cleaning", offset:-10, service:{day:0, win:"afternoon", label:"Cleaning date"}, scale:["size"], providers:[
    {id:"sparkle", name:"Sparkle Cleaning", desc:"Deep move-out clean, deposit-return checklist included.", rating:"4.8", count:"450 cleans", base:180},
    {id:"fresh", name:"Fresh Start Crew", desc:"Deep clean plus inside appliances and windows.", rating:"4.9", count:"233 cleans", base:240},
    {id:"tidy", name:"Tidy Exit", desc:"Standard clean for kitchens, baths and floors.", rating:"4.5", count:"610 cleans", base:130}]},
  {id:"repairs", title:"Patch walls and fix small damage", offset:-7, service:{day:-3, win:"any", label:"Visit date"}, scale:["sqrt"], providers:[
    {id:"handy", name:"HandyPro", desc:"Two-hour visit: patch holes, touch-up paint, fixtures.", rating:"4.7", count:"380 visits", base:160},
    {id:"fixit", name:"FixIt Same Week", desc:"Fixed-price wall patching, booked within 7 days.", rating:"4.5", count:"270 visits", base:120}]},
  {id:"moveday", title:"Move day", offset:0, note:"Final walkthrough, photos of the empty place, keys returned.", fixed:0},
  {id:"license", title:"Update your license and registration", offset:30, note:"Most states give you 30 to 60 days after you move. Fees vary by state.", fixed:null}
];

const SERVICE_TYPES={movers:'Movers',packers:'Packers',packing:'Packing supplies',internet:'Utilities and internet',cleaning:'Cleaning',repairs:'Handyman and repairs',storage:'Storage',junk:'Junk removal'};
const LEGACY_OPTIONS=Object.fromEntries(TASKS.filter(t=>t.providers).map(t=>[t.id,t.providers.map(p=>({...p}))]));
TASKS.push({id:'packers',title:'Book packing help',offset:-24,service:{day:-1,win:'morning',label:'Packing date'},providers:[]},{id:'storage',title:'Arrange storage',offset:-18,service:{day:0,win:'any',label:'Storage start date'},providers:[]},{id:'junk',title:'Book junk removal',offset:-12,service:{day:-2,win:'any',label:'Collection date'},providers:[]});
TASKS.forEach(t=>{if(t.providers)t.providers=[];});
let catalogKey='',catalogLoaded=false,catalogLoading=false,catalogError='',catalogGeneration=0;
function catalogRouteKey(){return state.move?`${state.move.from}|${state.move.to}|${state.uid||''}`:'';}
function restoreBookedOptions(){for(const task of TASKS.filter(t=>t.providers)){const booking=state.bookings?.[task.id];if(!booking||task.providers.some(p=>p.id===booking.provider))continue;const old=booking.providerSnapshot||LEGACY_OPTIONS[task.id]?.find(p=>p.id===booking.provider)||{id:booking.provider,name:'Previously selected provider',desc:'Your saved service request',base:booking.price};task.providers.push({...old,archived:true});}}
async function refreshProviderCatalog(force=false){
 const key=catalogRouteKey();if(!key||!state.signedIn)return;if(!force&&catalogKey===key&&(catalogLoaded||catalogLoading))return;
 const generation=++catalogGeneration;catalogKey=key;catalogLoading=true;catalogError='';
 if(!catalogLoaded||force===false){TASKS.forEach(t=>{if(t.providers)t.providers=[];});restoreBookedOptions();}
 try{if(!sb?.rpc)throw Error('Connection unavailable');const {data,error}=await sb.rpc('moveme_customer_provider_options',{p_from_city:state.move.from,p_to_city:state.move.to});if(error)throw error;if(generation!==catalogGeneration||catalogRouteKey()!==key)return;
 for(const task of TASKS.filter(t=>t.providers)){task.providers=(data||[]).filter(r=>r.provider_type===SERVICE_TYPES[task.id]).map(r=>({id:r.id,name:r.business_name,desc:r.service_includes,base:Number(r.service_price),fixed:true,area:r.service_area}));}
 restoreBookedOptions();let removed=false;for(const task of TASKS.filter(t=>t.providers)){const chosen=state.picks[task.id];if(chosen&&chosen!=='diy'&&!state.bookings[task.id]&&!task.providers.some(p=>p.id===chosen&&!p.archived)){delete state.picks[task.id];removed=true;}}
 catalogLoaded=true;catalogLoading=false;if(removed){save();toast('Some providers are no longer available. Please choose another option.');}else if(force)toast('Provider options updated.');if(curScreen==='plan')renderPlan();
 }catch(error){if(generation!==catalogGeneration)return;catalogLoading=false;catalogError='Couldn’t refresh provider options. Check your connection and try again.';if(curScreen==='plan')renderPlan();}
}
function providerOptionsToolbar(){return `<div class="catalog-toolbar"><div><strong>Providers for your move</strong><p class="hint">Active businesses serving the cities on your route.</p></div><button class="btn btn-line btn-sm" data-refresh-providers ${catalogLoading?'disabled':''}>${catalogLoading?'Refreshing…':'Refresh providers'}</button></div>${catalogError?`<p class="form-err" role="alert">${catalogError}</p>`:''}${catalogLoading?'<p class="hint" role="status">Loading provider options…</p>':''}`;}
document.addEventListener('click',e=>{if(e.target.closest('[data-refresh-providers]')){refreshProviderCatalog(true);renderPlan();}});

const KEY = "moveme-plan-v1";
let state = load() || {move:null, picks:{}, done:{}, open:null};
state.bookings = state.bookings || {};
state.custom = state.custom || [];
state.providers = state.providers || [];  // provider accounts created this session
state.provider = null;                    // signed-in provider
state.signedIn = false;                   // customer signed in
state.uid = null;                         // signed-in customer id

// Every visit starts fresh: nothing is read from or written to browser storage.
// Any data saved by earlier versions of the app is cleared on open.
function load(){ try{ localStorage.removeItem(KEY); }catch(e){} return null; }

/* ---------- Database (Supabase) ---------- */
// The publishable key is meant to be public; row-level security in the database
// makes sure each person can only read and change their own records.
const SUPABASE_URL = "https://dgqylxsrfsskiuxwvbsh.supabase.co";
const SUPABASE_KEY = "sb_publishable_EDSe_zZcKjLyLVYyb3rjVw_6hmT37ZI";
// "Keep me signed in": when ticked, the sign-in is kept in this browser; otherwise it
// only lasts while the page is open, so the next visit starts signed out.
const REMEMBER_KEY = "moveme-remember";
let remember = false;
try{ remember = localStorage.getItem(REMEMBER_KEY) === "1"; }catch(e){}
const memStore = {};
const authStorage = {
  getItem(k){ if(remember){ try{ return localStorage.getItem(k); }catch(e){} } return k in memStore ? memStore[k] : null; },
  setItem(k, v){ if(remember){ try{ localStorage.setItem(k, v); return; }catch(e){} } memStore[k] = v; },
  removeItem(k){ delete memStore[k]; try{ localStorage.removeItem(k); }catch(e){} }
};
function setRemember(on){
  remember = !!on;
  try{ if(on) localStorage.setItem(REMEMBER_KEY, "1"); else localStorage.removeItem(REMEMBER_KEY); }catch(e){}
}
// A password-reset email link brings people back with "type=recovery" in the address.
const OPENED_FROM_RESET = /type=recovery/.test(location.hash) || /type=recovery/.test(location.search);
const SITE_URL = location.origin + location.pathname;
// Local files cannot receive email callbacks; use the configured project URL instead.
const AUTH_REDIRECT_URL = /^https?:$/.test(location.protocol) ? SITE_URL : null;
async function databaseFetch(input, init = {}) {
  const controller = new AbortController();
  const abort = () => controller.abort();
  if(init.signal?.aborted) controller.abort();
  else init.signal?.addEventListener("abort", abort, {once:true});
  const timer = setTimeout(abort, 15000);
  try { return await fetch(input, {...init, signal:controller.signal}); }
  finally { clearTimeout(timer); init.signal?.removeEventListener("abort", abort); }
}
let sb = null;
try{
  if(window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    global:{ fetch:databaseFetch },
    auth:{ persistSession:true, storage:authStorage, autoRefreshToken:true, detectSessionInUrl:true }
  });
}catch(e){ sb = null; }
const DB_DOWN = "We can’t connect to Move Me right now. Check your connection and try again.";
function planPayload(){ return {move:state.move, picks:state.picks, done:state.done, custom:state.custom, bookings:state.bookings, requestPlanId:state.requestPlanId, archivedMoves:state.archivedMoves||[], dismissedRequests:state.dismissedRequests||[]}; }
let saveTimer = null;
function save(){
  if(!sb || !state.signedIn || !state.uid) return;
  clearTimeout(saveTimer);
  const uid=state.uid,payload=JSON.parse(JSON.stringify(planPayload()));
  saveTimer = setTimeout(async ()=>{
    if(!state.signedIn||state.uid!==uid)return;
    try{const {error}=await sb.from("move_plans").upsert({customer_id:uid,plan:payload,updated_at:new Date().toISOString()});
    if(error&&state.uid===uid)toast("Couldn't save your latest changes. Check your connection.");}
    catch(error){if(state.uid===uid)toast("Couldn't save your latest changes. Check your connection.");}

  }, 500);
}
function toast(msg){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 4500);
}
function busy(btn, on, label){
  if(!btn) return;
  if(on){ btn.dataset.label = btn.textContent; btn.textContent = label; btn.disabled = true; }
  else { btn.textContent = btn.dataset.label || btn.textContent; btn.disabled = false; }
}
function freshPlan(){ return {archivedMoves:[], move:null, picks:{}, done:{}, bookings:{}, custom:[], open:null, draft:{}, draftPhone:null, returnTo:null, requestPlanId:null, dismissedRequests:[], pendingSubmission:null, providerHomeFresh:false, compareTask:null, comparisonPicks:{}}; }
function providerFromRow(r){ return {id:r.id, business:r.business_name, type:r.provider_type, name:r.contact_name, area:r.service_area, email:r.email, phone:r.phone, status:r.status, businessDescription:r.business_description, serviceDescription:r.service_description, serviceIncludes:r.service_includes, startingPrice:r.starting_price, pricingBasis:r.pricing_basis, listingReady:r.listing_ready, reviewedAt:r.reviewed_at, rejectionReason:r.rejection_reason}; }
function authMessage(error){
  const m = (error && error.message || "").toLowerCase();
  if(m.includes("already registered") || m.includes("already been registered")) return "exists";
  if(m.includes("email not confirmed")) return "Confirm your email first. Check your inbox for the link from Move Me, then sign in.";
  if(m.includes("invalid login")) return "That email and password don't match an account. Check them and try again.";
  if(m.includes("rate limit") || m.includes("too many")) return "Too many attempts. Wait a few minutes and try again.";
  if(m.includes("abort") || m.includes("timeout")) return "The connection timed out. Check your internet connection and try again.";
  if(m.includes("fetch") || m.includes("network")) return DB_DOWN;
  return (error && error.message) || DB_DOWN;
}
async function signOutAll(){ resetRequestSession(); catalogGeneration++;catalogKey='';catalogLoaded=false;catalogLoading=false;catalogError='';TASKS.forEach(t=>{if(t.providers)t.providers=[];}); clearTimeout(saveTimer); if(sb) try{ await sb.auth.signOut(); }catch(e){} setRemember(false); state = {...state, ...freshPlan(), user:null, uid:null, signedIn:false, provider:null, admin:false}; adminRows=[];adminSelected=null;adminGeneration++; }

/* Load whoever is signed in. Returns "customer", "provider", or null; throws if the database can't be reached. */
async function loadAccount(uid){
  resetRequestSession();
  if(sb.rpc){const {data,error}=await sb.rpc('moveme_is_admin');if(!error&&data===true){state={...state,...freshPlan(),admin:true,uid,user:null,provider:null,signedIn:false};return 'admin';}}
  state.admin=false;
  const {data:prow, error:pe} = await sb.from("providers").select("*").eq("id", uid).maybeSingle();
  if(pe) throw pe;
  if(prow){ state = {...state, ...freshPlan(), user:null, uid:null, signedIn:false, provider:providerFromRow(prow)}; return "provider"; }
  const {data:row, error:ce} = await sb.from("customers").select("*").eq("id", uid).maybeSingle();
  if(ce) throw ce;
  if(!row) return null;
  const {data:planRow} = await sb.from("move_plans").select("plan").eq("customer_id", uid).maybeSingle();
  const saved = (planRow && planRow.plan) || {};

function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function price(task, p){
  if(p.fixed)return Number(p.base);
  const m = state.move; let f = 1;
  (task.scale||[]).forEach(s=>{
    if(s==="size") f *= SIZES[m.size][1];
    if(s==="access") f *= ACCESS[m.accessFrom||"ground"][1] * ACCESS[m.accessTo||"ground"][1];
    if(s==="sqrt") f *= Math.sqrt(SIZES[m.size][1]);
  });
  return Math.max(5, Math.round(p.base * f / 5) * 5);
}

}

function taskCost(task){
  if(task.providers){
    const bk = state.bookings[task.id];
    if(bk){ const pk = task.providers.find(p=>p.id===bk.provider); const prices = task.providers.filter(p=>!p.archived).map(p=>price(task,p)); return {chosen: bk.price, pick: pk, booked: bk, low: prices.length?Math.min(...prices):0, high: prices.length?Math.max(...prices):0}; }
    const prices = task.providers.filter(p=>!p.archived).map(p=>price(task,p));
    if(state.picks[task.id] === "diy") return {chosen: 0, pick: null, diy: true, low: prices.length?Math.min(...prices):0, high: prices.length?Math.max(...prices):0};
    const pick = task.providers.find(p=>p.id===state.picks[task.id]);
    return {chosen: pick ? price(task,pick) : null, pick, low: prices.length?Math.min(...prices):0, high: prices.length?Math.max(...prices):0};
  }
  return {chosen: task.fixed, fixedOnly:true};
}
function bookingStatus(b){ return b?.requestId ? (b.status||"requested") : "legacy"; }
function isTaskDone(t){
  if(t.providers){ const b = state.bookings[t.id]; if(!b && state.picks[t.id] === "diy") return !!state.done[t.id]; return b ? bookingStatus(b)==="completed" : false; }
  return !!state.done[t.id];
}
function allTasks(){
  const move = parseDate(state.move.date);
  const extra = (state.custom||[]).map(c => ({id:c.id, title:c.title, offset:daysBetween(move, parseDate(c.date)), note:"Your own task.", fixed:c.cost||0, custom:true}));
  return TASKS.concat(extra).sort((a,b)=>a.offset-b.offset);
}
function relText(n, isDone){
  if(isDone) return {t:"Done", late:false};
  if(n === 0) return {t:"Today", late:false};
  if(n < 0) return {t: (n===-1 ? "1 day" : (-n)+" days") + " overdue", late:true};
  if(n === 1) return {t:"Tomorrow", late:false};
  if(n < 14) return {t:"In "+n+" days", late:false};
  return {t:"In "+Math.round(n/7)+" weeks", late:false};
}

  <section class="lp-sec" aria-labelledby="prob-h"><div class="wrap">
    <p class="kicker">The problem</p>
    <h2 id="prob-h">Moving is simple to describe, and painful to actually do.</h2>
    <div class="problem">
      <div class="problem-points">
        <p>It's never just “hire a mover.” One move can mean movers, packing, cleaning, storage, junk removal and setting up utilities.</p>
        <p>Most people coordinate all of it themselves, across different websites, apps, calls and emails, with no shared timeline or budget.</p>
        <p>Nothing tells you what you need, when, or what it should cost. Tasks get missed, deadlines slip and costs arrive as surprises.</p>
      </div>
      <div class="juggle">
        <h3>Six or more separate things to juggle</h3>
        <ul>
          <li>${ic("truck",1)}Movers</li><li>${ic("boxes",1)}Packing</li><li>${ic("checklist",1)}Cleaning</li>
          <li>${ic("route",1)}Storage</li><li>${ic("dollar",1)}Utilities</li><li>${ic("calendar",1)}Junk removal</li>
        </ul>
      </div>
    </div>
  </div></section>

  <section class="lp-sec alt" id="how" aria-labelledby="how-h"><div class="wrap">
    <p class="kicker">How it works</p>
    <h2 id="how-h">From a few details to a full plan.</h2>
    <div class="steps3">
      <div class="step">${ic("calendar",1)}<div class="num">Step 1</div><h3>Tell us about your move</h3><p>Where you're moving from and to, your move date and home size.</p></div>
      <div class="step">${ic("checklist",1)}<div class="num">Step 2</div><h3>Get a personalized plan</h3><p>A timeline, checklist, estimated costs and a short list of local providers to choose from for each task.</p></div>
      <div class="step">${ic("route",1)}<div class="num">Step 3</div><h3>Manage it all in one place</h3><p>Tasks, bookings, deadlines and costs stay together. Adjust as things change.</p></div>
    </div>
  </div></section>

  <section class="lp-sec" id="why" aria-labelledby="why-h"><div class="wrap">
    <p class="kicker">Why Move Me</p>
    <h2 id="why-h">Not another listings site.</h2>
    <p class="sec-lede">Other tools cover pieces of a move, like vendor lists through a property manager or a paid concierge. Move Me is self-serve and built around your own plan.</p>
    <div class="compare">
      <div class="col old"><h3>The typical approach</h3><ul>
        <li><span class="x" aria-label="Without Move Me">✕</span><span>Search separate sites and apps for each service</span></li>
        <li><span class="x" aria-label="Without Move Me">✕</span><span>Piece together your own timeline and budget</span></li>
        <li><span class="x" aria-label="Without Move Me">✕</span><span>Re-plan everything by hand when something changes</span></li>
        <li><span class="x" aria-label="Without Move Me">✕</span><span>No single view of what's booked, due or spent</span></li></ul></div>
      <div class="col new"><h3>The Move Me approach</h3><ul>
        <li><span class="y" aria-label="With Move Me">✓</span><span>One plan built around your move, not a directory to search</span></li>
        <li><span class="y" aria-label="With Move Me">✓</span><span>Clear answers: what you need, when, at what cost, from whom</span></li>
        <li><span class="y" aria-label="With Move Me">✓</span><span>Update your plan when things change. It adjusts; you don't rebuild</span></li>
        <li><span class="y" aria-label="With Move Me">✓</span><span>Tasks, bookings, deadlines and costs in one place</span></li></ul></div>
    </div>
  </div></section>

  <section class="lp-sec alt" aria-labelledby="val-h"><div class="wrap">
    <p class="kicker">What changes</p>
    <h2 id="val-h">Moving with Move Me feels different.</h2>
    <div class="values">
      <div class="value">${ic("checklist",1)}<div><h3>Less falls through the cracks</h3><p>One shared timeline and checklist instead of scattered tabs, texts and reminders.</p></div></div>
      <div class="value">${ic("dollar",1)}<div><h3>Costs are clear up front</h3><p>A realistic estimate before you commit, instead of surprises as the bills come in.</p></div></div>
      <div class="value">${ic("route",1)}<div><h3>Less time coordinating</h3><p>A plan that already knows what you need and when, so you're not researching from scratch.</p></div></div>
      <div class="value">${ic("bulb",1)}<div><h3>More confidence in each choice</h3><p>Every task points to vetted services, so decisions feel guided, not guessed at.</p></div></div>
    </div>
  </div></section>

  <section class="lp-sec" aria-labelledby="who-h"><div class="wrap">
    <div class="forwho">${ic("users",1)}<div>
      <h2 id="who-h">Made for people who move often.</h2>
      <p>Students, renters and young professionals feel every part of the hassle, and would rather plan and book online than chase quotes by phone. If that's you, Move Me was built with you in mind.</p>
    </div></div>
  </div></section>

  <section class="lp-final" aria-labelledby="fin-h"><div class="wrap">
    <h2 id="fin-h">Stop juggling. Start your plan.</h2>
    <p>Create your account, tell us about your move, and see your full timeline and total estimate in about a minute.</p>
    <div class="cta-row"><button class="btn btn-coral" data-start>${cta}</button></div>
  </div></section>
  </main>
  <footer class="lp-foot"><div class="wrap"><span>Move Me</span><button type="button" class="foot-link" data-provsignup>Are you a mover, packer or service provider? Join Move Me</button><span>Serving Dallas, Houston and Austin.</span></div></footer>`;
}

  document.getElementById("app").innerHTML = `

      <p class="role-switch">${admin ? `<button class="clear" data-login="customer">Customer sign in</button>` : prov ? `Planning a move? <button class="clear" data-login="customer">Customer sign in</button>` : `Providing services? <button class="clear" data-login="provider">Provider sign in</button>`}</p>

      const {data, error} = await sb.auth.signInWithPassword({email, password:pw});

      const role = await loadAccount(data.user.id);
      const wanted = admin ? "admin" : prov ? "provider" : "customer";
      if(!["customer","provider","admin"].includes(role) || (wanted === "admin" && role !== "admin")){
        await signOutAll(); busy(btn,false);

                 : "This email is registered as a provider, not a customer. Use provider sign in instead.");
        return;
      }
      goHome(role);
    }catch(err){ setRemember(false); busy(btn,false); showErr(DB_DOWN); }
  });

const PROVIDER_TYPES = ["Movers","Packers","Packing supplies","Utilities and internet","Cleaning","Handyman and repairs","Storage","Junk removal"];
const PROVIDER_DEFAULTS={
 'Movers':{includes:'Loading, transport, and unloading for a local move.',price:350},
 'Packers':{includes:'Packing household items into boxes, including basic packing materials.',price:150},
 'Packing supplies':{includes:'A moving supply bundle with boxes, packing tape, and protective wrap.',price:75},
 'Utilities and internet':{includes:'Internet setup assistance and coordination of a home service appointment.',price:80},
 'Cleaning':{includes:'Move-out cleaning of the kitchen, bathrooms, floors, and accessible surfaces.',price:180},
 'Handyman and repairs':{includes:'Minor wall patching, touch-ups, and small household repairs.',price:120},
 'Storage':{includes:'One month of storage for household items in a standard storage unit.',price:100},
 'Junk removal':{includes:'Collection, loading, and disposal of a small load of unwanted household items.',price:150}
};
function serviceCurrency(value){return Number(value).toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});}
function providerServiceComplete(p){return !!(p&&p.serviceIncludes?.trim()&&Number(p.startingPrice)>0&&Number(p.startingPrice)<=1000000&&p.pricingBasis==='per_job'&&formatPhone(p.phone||''));}
function providerServiceFields(prefix,p={}){
 const preset=PROVIDER_DEFAULTS[p.type];const includes=p.serviceIncludes||preset?.includes||'';
 const price=p.pricingBasis&&p.pricingBasis!=='per_job'?'':p.startingPrice??preset?.price??'';
 return `<fieldset class="form-section"><legend>Your service</legend><div class="field" data-f="${prefix}-service-includes"><label for="${prefix}-service-includes">What does your service include?</label><textarea id="${prefix}-service-includes" maxlength="2000" placeholder="Describe what the customer gets for this price.">${esc(includes)}</textarea><span class="err" aria-live="polite"></span></div><div class="field" data-f="${prefix}-starting-price"><label for="${prefix}-starting-price">Service price (USD)</label><input id="${prefix}-starting-price" type="number" min="0.01" max="1000000" step="0.01" value="${esc(price)}" placeholder="150.00"><span class="err" aria-live="polite"></span></div>${p.pricingBasis&&p.pricingBasis!=='per_job'?'<p class="hint">Your previous price used a different pricing basis. Enter a fixed price for the service described above.</p>':''}</fieldset>`;
}
function serviceFieldValues(prefix){const includes=document.getElementById(prefix+'-service-includes').value.trim();return {business_description:includes,service_description:includes,service_includes:includes,starting_price:document.getElementById(prefix+'-starting-price').value.trim(),pricing_basis:'per_job'};}
function validateServiceFields(prefix,fields){const errors={};if(!fields.service_includes||fields.service_includes.length>2000)errors[prefix+'-service-includes']='Explain what your service includes.';const price=Number(fields.starting_price);if(!Number.isFinite(price)||price<=0||price>1000000||!/^\d+(\.\d{1,2})?$/.test(fields.starting_price))errors[prefix+'-starting-price']='Enter a price from $0.01 to $1,000,000, using up to two decimal places.';return errors;}
function providerServiceSummary(p){return `<div class="provider-inline-service"><div class="provider-card-head"><h2>Your service</h2><span class="badge ${providerServiceComplete(p)?'':'pending'}">${providerServiceComplete(p)?'Details complete':'Details needed'}</span></div>${providerServiceComplete(p)?`<p><strong>What’s included</strong><br>${esc(p.serviceIncludes)}</p><p><strong>${serviceCurrency(p.startingPrice)}</strong> · Fixed service price</p>`:'<p>Add what your service includes and its fixed price before your offering can be listed.</p>'}</div>`;}

function setupProviderWizard(form,prefix,editing){
 const signup=!editing;
 const ids=signup?{business:'pv-biz',area:'pv-area',type:'pv-type',name:'pv-name',phone:'pv-phone',email:'pv-email',password:'pv-pw'}:{business:'provider-business',area:'provider-area',name:'provider-contact',phone:'provider-phone'};
 const field=id=>document.getElementById(id)?.closest('.field');
 const headings=['Business details','Service offering','Contact and account'];
 const panels=headings.map((heading,index)=>{const panel=document.createElement('section');panel.className='provider-step';panel.dataset.step=index;panel.setAttribute('aria-labelledby',`provider-step-${index}`);panel.innerHTML=`<h2 id="provider-step-${index}" tabindex="-1">${heading}</h2><p class="hint">${['Tell us about your business and where you work.','Describe one service and how it is priced.','Check your contact information before submitting.'][index]}</p>`;return panel;});
 const add=(step,id)=>{const node=field(id);if(node)panels[step].appendChild(node);};
 add(0,ids.business);if(ids.type)add(0,ids.type);else{const info=document.createElement('dl');info.className='provider-readonly';info.innerHTML=`<div><dt>Service type</dt><dd>${esc(state.provider.type)}</dd></div>`;panels[0].appendChild(info);}
 add(0,ids.area);
 for(const key of ['service-includes','starting-price'])add(1,prefix+'-'+key);
 const note=document.createElement('p');note.className='hint';note.textContent='This fixed price covers the service described above. Edit the suggested description and price to suit your offering.';panels[1].appendChild(note);
 add(2,ids.name);add(2,ids.phone);if(signup){add(2,ids.email);add(2,ids.password);}else{const info=document.createElement('dl');info.className='provider-readonly';info.innerHTML=`<div><dt>Sign-in email</dt><dd>${esc(state.provider.email)}</dd></div>`;panels[2].appendChild(info);}
 const submit=form.querySelector('[type=submit]');if(editing)submit.textContent='Save changes';
 const error=form.querySelector(signup?'#pv-err':'#provider-profile-error');const footer=form.querySelector('.fineprint');
 form.replaceChildren();const progress=document.createElement('div');progress.className='provider-progress';progress.innerHTML='<p class="provider-step-count" role="status" aria-live="polite"></p><ol aria-label="Application steps">'+headings.map(h=>`<li>${h}</li>`).join('')+'</ol>';form.append(progress,...panels,error);
 const actions=document.createElement('div');actions.className='provider-wizard-actions';actions.innerHTML='<button type="button" class="btn btn-line" data-step-back>Back</button><button type="button" class="btn btn-coral" data-step-next>Continue</button>';actions.appendChild(submit);form.append(actions);if(footer)form.appendChild(footer);
 let step=0;const back=actions.querySelector('[data-step-back]'),next=actions.querySelector('[data-step-next]');
 const show=(index,focus=true)=>{step=index;panels.forEach((p,i)=>p.hidden=i!==step);progress.querySelector('p').textContent=`Step ${step+1} of 3`;progress.querySelectorAll('li').forEach((li,i)=>{if(i===step)li.setAttribute('aria-current','step');else li.removeAttribute('aria-current');li.classList.toggle('step-complete',i<step);});back.hidden=step===0;next.hidden=step===2;submit.hidden=step!==2;if(focus){const heading=panels[step].querySelector('h2');heading.focus({preventScroll:true});form.scrollIntoView({block:'start',behavior:'smooth'});}};
 const validate=index=>{const errors={};const value=id=>(document.getElementById(id)?.value||'').trim();
 if(index===0){if(!value(ids.business))errors[ids.business]='Enter your business name.';if(ids.type&&!value(ids.type))errors[ids.type]='Choose the type of service you provide.';if(!['All three cities',...CITIES].includes(value(ids.area)))errors[ids.area]='Choose a service area.';}
 if(index===1){const all=validateServiceFields(prefix,serviceFieldValues(prefix));for(const [id,message]of Object.entries(all))errors[id]=message;}
 if(index===2){if(!value(ids.name))errors[ids.name]='Enter a contact name.';if(!formatPhone(value(ids.phone)))errors[ids.phone]='Enter a 10-digit US phone number.';if(signup){if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value(ids.email)))errors[ids.email]='Enter a valid business email.';if(document.getElementById(ids.password).value.length<8)errors[ids.password]='Use at least 8 characters.';}}
 panels[index].querySelectorAll('.field').forEach(f=>{const input=f.querySelector('input,select,textarea');const message=errors[input.id];f.classList.toggle('bad',!!message);f.querySelector('.err').textContent=message||'';});
 const first=Object.keys(errors)[0];if(first){show(index,false);error.textContent='Please complete the highlighted fields.';document.getElementById(first).focus();return false;}error.textContent='';return true;};
 next.addEventListener('click',()=>{if(validate(step))show(step+1);});back.addEventListener('click',()=>{if(!submit.disabled){error.textContent='';show(step-1);}});
 form.addEventListener('submit',e=>{if(step<2){e.preventDefault();e.stopImmediatePropagation();if(validate(step))show(step+1);return;}for(let i=0;i<3;i++)if(!validate(i)){e.preventDefault();e.stopImmediatePropagation();return;}},true);
 if(signup){
  const description=document.getElementById(prefix+'-service-includes'),price=document.getElementById(prefix+'-starting-price');
  let descriptionEdited=false,priceEdited=false;
  description.addEventListener('input',()=>descriptionEdited=true);price.addEventListener('input',()=>priceEdited=true);
  document.getElementById(ids.type).addEventListener('change',()=>{const preset=PROVIDER_DEFAULTS[document.getElementById(ids.type).value];if(!preset)return;if(!descriptionEdited)description.value=preset.includes;if(!priceEdited)price.value=preset.price;});
 }
 show(0,false);
}

function resetRequestSession(){requestGeneration++;customerRequestRevision++;requestSubmitting=false;providerDecisionBusy=false;customerRequestRows=[];providerRequestRows=[];customerRequestsLoaded=false;providerRequestsLoaded=false;customerRequestsLoading=false;providerRequestsLoading=false;customerRequestsError='';providerRequestsError='';providerRequestTab='requested';}
function requestUuid(){return crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const n=crypto.getRandomValues(new Uint8Array(1))[0]%16;return (c==='x'?n:(n&3)|8).toString(16);});}
function requestCode(row){return 'MM-'+row.id.slice(0,8).toUpperCase();}
function requestStatusLabel(status){return ({requested:'Awaiting provider',accepted:'Confirmed',declined:'Declined',completed:'Completed',cancelled:'Cancelled',legacy:'Saved request'})[status]||'Awaiting provider';}
function requestError(error){const msg=error?.message||'';if(error?.code==='PGRST202'||/function .*schema cache|does not exist/i.test(msg))return 'Requests are unavailable right now. Please try again later.';return /network|fetch|abort|timeout|Connection unavailable/i.test(msg)?DB_DOWN:msg||DB_DOWN;}
function bookingFromRequest(row){return {requestId:row.id,planId:row.plan_id,provider:row.provider_id||row.listing_id,providerSnapshot:{id:row.provider_id||row.listing_id,name:row.provider_name,desc:row.service_includes,base:Number(row.service_price),fixed:true},price:Number(row.service_price),date:row.service_date,win:row.time_window,notes:row.notes,contactPhone:row.customer_phone,conf:requestCode(row),at:Date.parse(row.created_at),status:row.status,decisionReason:row.decision_reason,moveSnapshot:row.move_snapshot};}
function applyCustomerRequests(rows){
 customerRequestRows=rows;state.dismissedRequests=state.dismissedRequests||[];
 const current=rows.filter(row=>row.plan_id===state.requestPlanId);
 const latest=new Map();for(const row of current){if(!latest.has(row.task_id))latest.set(row.task_id,row);}
 for(const task of bookable()){
   const row=latest.get(task.id),old=state.bookings[task.id];
   if(row&&row.status!=='cancelled'&&!state.dismissedRequests.includes(row.id)){
     state.bookings[task.id]=bookingFromRequest(row);state.picks[task.id]=row.provider_id||row.listing_id;state.done[task.id]=row.status==='completed'&&!row.completion_disputed;
   }else if(old?.requestId){delete state.bookings[task.id];if(state.picks[task.id]===old.provider)delete state.picks[task.id];state.done[task.id]=false;}
 }
 restoreBookedOptions();
}
async function refreshCustomerRequests(force=false,paint=true){
 if(!state.signedIn||!state.uid||customerRequestsLoading||(!force&&customerRequestsLoaded))return;
 const uid=state.uid,generation=requestGeneration,revision=customerRequestRevision,firstLoad=!customerRequestsLoaded,priorError=customerRequestsError;customerRequestsLoading=true;customerRequestsError='';
 try{if(!sb?.rpc)throw Error('Connection unavailable');const {data,error}=await sb.rpc('moveme_customer_requests_v3');if(error)throw error;if(uid!==state.uid||generation!==requestGeneration)return;
 if(revision!==customerRequestRevision){customerRequestsLoading=false;return refreshCustomerRequests(true,paint);}
 if(!Array.isArray(data))throw Error('Could not load requests. Refresh requests and try again.');const before=JSON.stringify(state.bookings);applyCustomerRequests(data);customerRequestsLoaded=true;customerRequestsLoading=false;
 if(before!==JSON.stringify(state.bookings))save();
 if(paint&&(paint!=='changed'||firstLoad||priorError||before!==JSON.stringify(state.bookings))&&(curScreen==='plan'||curScreen==='confirmation')){curScreen==='plan'?renderPlan():renderConfirmation();}
 }catch(error){if(uid!==state.uid||generation!==requestGeneration)return;customerRequestsLoading=false;customerRequestsError=requestError(error);if(paint&&(curScreen==='plan'||curScreen==='confirmation'))curScreen==='plan'?renderPlan():renderConfirmation();}
}

function renderProviderHome(fresh){
  fresh=fresh===undefined?(curScreen==='provhome'&&state.providerHomeFresh===true):!!fresh;
  state.providerHomeFresh=fresh;
  const p = state.provider;
  if(!p){ renderSignIn('provider'); return; }
  if(!providerRequestsLoaded&&!providerRequestsLoading&&!providerRequestsError)refreshProviderRequests();
  const approved = p.status === 'approved', rejected = p.status === 'rejected';
  const area = p.area === 'All three cities' ? 'Dallas, Houston and Austin, Texas' : p.area;
  const statusLabel = approved ? 'Approved' : rejected ? 'Not approved' : 'Under review';
  const statusText = approved ? ''

function formatPhone(raw){
  let d = raw.replace(/\D/g,"");
  if(d.length === 11 && d[0] === "1") d = d.slice(1);
  if(d.length !== 10) return null;
  return "("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6);
}

const CITIES = ["Dallas, TX", "Houston, TX", "Austin, TX"];
// Match a saved city (even one typed before the dropdowns existed) to a list value; never leave it blank.
function matchCity(saved, fallback){
  const v = String(saved||"").toLowerCase();
  if(!v) return fallback;
  return CITIES.find(c=>c===saved) || CITIES.find(c=>v.includes(c.split(",")[0].toLowerCase())) || fallback;
}
// New plans start with "Choose a city" so nobody builds a plan for the wrong cities by accident.
// Editing an existing plan keeps the cities already chosen.
function cityOptions(sel, fallback){
  const pick = matchCity(sel, fallback);
  return (pick ? "" : `<option value="" selected disabled>Choose a city</option>`) +
    CITIES.map(c=>`<option value="${c}" ${c===pick?"selected":""}>${c}</option>`).join("");
}

function nextSteps(){
  const all = bookable();

  const diy = all.filter(t=>!state.bookings[t.id] && state.picks[t.id] === "diy");
  const settled = booked.filter(t=>["accepted","completed"].includes(bookingStatus(state.bookings[t.id]))).length + diy.length === all.length;
  let h, p;
  if(settled){ h = "Your services are arranged"; p = "Track provider confirmations and check off your remaining tasks as move day gets closer."; }
  else if(ready.length){ h = "Review your service requests"; p = `${ready.length} selected service${ready.length>1?'s are':' is'} ready to request${open.length?`. You can choose the remaining ${open.length} later`:''}.`; }
  else { const first=open[0]; h = first ? `Choose ${first.title.toLowerCase().replace(/^book /,'').replace(/^order /,'')}` : "Keep your move on track"; p = "Compare providers below to find the right service for your move."; }

}

async function confirmBookings(){
  if(requestSubmitting)return;
  syncDraft();
  const ready = bookable().filter(t=>!state.bookings[t.id] && state.picks[t.id] && state.picks[t.id] !== "diy" && t.providers.some(p=>p.id===state.picks[t.id]&&!p.archived));
  let bad = null;
  ready.forEach(t=>{ const d = state.draft[t.id].date; const f = document.querySelector(`[data-f="d-${t.id}"]`);
    const msg = !d ? "Pick a date." : parseDate(d) < today ? "Pick today or a future date." : "";

  if(!phone){ const f=document.querySelector('[data-f="request-phone"]');f.classList.add('bad');f.querySelector('.err').textContent='Enter a 10-digit US phone number.';document.getElementById('request-phone').focus();return; }

  if(requestSubmitting)return;
  const button=document.getElementById('confirm'),uid=state.uid,generation=requestGeneration;
  if(!sb?.rpc||!uid){renderReview(DB_DOWN);return;}
  if(!ready.length)return;
  state.requestPlanId=state.requestPlanId||requestUuid();
  const items=ready.map(t=>{const p=t.providers.find(x=>x.id===state.picks[t.id]),d=state.draft[t.id];return {task_id:t.id,provider_id:p.id,quoted_price:price(t,p),date:d.date,win:d.win,notes:(d.notes||'').trim()};});
  const signature=JSON.stringify({plan:state.requestPlanId,move:state.move,items,phone});
  if(state.pendingSubmission?.signature!==signature)state.pendingSubmission={signature,id:requestUuid()};
  const args={p_plan_id:state.requestPlanId,p_batch_id:state.pendingSubmission.id,p_move:{...state.move},p_requests:items,p_phone:phone};
  clearTimeout(saveTimer);requestSubmitting=true;busy(button,true,'Sending requests…');
  try{
    const {data,error}=await sb.rpc('moveme_submit_requests_v3',args);if(error)throw error;

    customerRequestRevision++;state.user.phone=phone;

    state.pendingSubmission=null;state.draft={};state.draftPhone=null;state.open=null;save();
    if(curScreen==='review'){renderConfirmation(data.map(row=>row.task_id));window.scrollTo(0,0);}else toast('Your requests have been sent. View your plan to track them.');
  }catch(error){if(uid===state.uid&&generation===requestGeneration){if(curScreen==='review')renderReview(requestError(error));else toast(requestError(error));}}
  finally{if(generation===requestGeneration)requestSubmitting=false;if(button?.isConnected)busy(button,false);}

}

function totals(){
  let spent = 0, projected = 0;
  allTasks().forEach(t=>{
    const c = taskCost(t);
    if(c.fixedOnly){ if(c.chosen){ if(t.custom) spent += c.chosen; else projected += c.chosen; } }
    else if(c.chosen != null) spent += c.chosen;
    else projected += (c.low + c.high) / 2;
  });
  return {spent, projected};
}

/* ---------- Back navigation ----------
   Each screen change adds a browser history entry, so the browser's back arrow
   (and swipe-back on phones) moves between Move Me screens instead of leaving
   the site. A Back button in each header does the same thing. */
let navPopping = false, navDepth = 0, curScreen = null;
function navArgs(name, args){
  if(name === "signin" || name === "forgot") return [args[0]];
  if(name === "checkemail") return [args[0], args[1]];
  return []; // other screens rebuild from the current state
}
// Preserve the initial composition when details or validation messages grow a form.
function anchorSetupForms(){
  if(document.querySelector("#app .audience-auth-page, #app .signed-edit-page")) return;
  const grid = document.querySelector('#app .setup-main');
  if(!grid) return;
  grid.style.alignItems = '';
  const children = [...grid.children];
  children.forEach(child => child.style.marginTop = '');
  if(window.matchMedia('(max-width: 820px)').matches) return;
  // Measure the compact move form, including when saved access details start open.
  const disclosures = [...grid.querySelectorAll('#setup details[open]')];
  disclosures.forEach(details => details.open = false);
  const top = grid.getBoundingClientRect().top;
  const padding = parseFloat(getComputedStyle(grid).paddingTop) || 0;
  const offsets = children.map(child => Math.max(0, child.getBoundingClientRect().top - top - padding));
  grid.style.alignItems = 'start';
  children.forEach((child, index) => child.style.marginTop = offsets[index] + 'px');
  disclosures.forEach(details => details.open = true);
}
window.addEventListener('resize', anchorSetupForms);
function navWrap(name, fn){
  return function(...args){
    const r = fn.apply(this, args);
    const entry = {mm:true, screen:name, args:navArgs(name, args)};
    if(navPopping || curScreen === name){ entry.depth = navDepth; history.replaceState(entry, ""); }
    else if(curScreen === null){ entry.depth = navDepth = 0; history.replaceState(entry, ""); }
    else { entry.depth = ++navDepth; history.pushState(entry, ""); }
    curScreen = name;
    addBackButton();
    anchorSetupForms();
    return r;
  };
}
